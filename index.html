<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PUBLICARTEL · MOVIMIENTOS</title>
  <style>
    :root{
      --brand:#0B2D5C;
      --brand2:#154B9A;
      --bg:#F3F6FB;
      --card:#FFFFFF;
      --text:#0B2D5C;
      --muted:rgba(11,45,92,.70);
      --border:rgba(11,45,92,.28);
      --danger:#B00020;
      --ok:#0F7A3A;
      --shadow:0 10px 30px rgba(11,45,92,.10);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);text-transform:uppercase}
    .wrap{max-width:560px;margin:0 auto;padding:16px}

    .header{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;border-radius:var(--radius);
      padding:16px 14px;box-shadow:var(--shadow);
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .brandTitle{font-weight:900;letter-spacing:.6px;font-size:18px;line-height:1.1}
    .brandSub{font-size:12px;opacity:.92;margin-top:4px;letter-spacing:.4px}

    .card{
      margin-top:14px;background:var(--card);border-radius:var(--radius);padding:14px;
      box-shadow:var(--shadow);border:1px solid rgba(11,45,92,.08)
    }

    label{display:block;margin-top:12px;font-weight:900;font-size:12px;letter-spacing:.4px;color:var(--muted)}
    input,select,textarea,button{
      width:100%;padding:12px;margin-top:6px;border-radius:12px;border:2px solid var(--border);
      font-size:16px;text-transform:uppercase;background:#fff;color:var(--text);outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:rgba(21,75,154,.65);box-shadow:0 0 0 3px rgba(21,75,154,.12)}
    textarea{min-height:76px;resize:vertical}

    .btn{
      border:none;font-weight:900;letter-spacing:.7px;cursor:pointer;
      background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
      box-shadow:0 10px 20px rgba(11,45,92,.14)
    }
    .btn-secondary{
      background:#fff;color:var(--brand);border:2px solid var(--border);box-shadow:none;font-weight:900
    }
    .btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}

    .camWrap{
      display:none;margin-top:12px;border-radius:var(--radius);overflow:hidden;
      border:2px solid var(--border);background:#000
    }
    video{width:100%;height:320px;object-fit:cover;display:block;background:#000}

    .hint{
      display:none;margin-top:10px;padding:10px 12px;border-radius:12px;
      background:rgba(11,45,92,.06);border:1px solid rgba(11,45,92,.10);
      font-weight:900
    }
    .hint .line2{margin-top:6px;color:var(--muted);font-size:12px;font-weight:900}

    .msg{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px;letter-spacing:.3px}
    .msg.err{color:var(--danger);font-weight:900}
    .msg.ok{color:var(--ok);font-weight:900}

    /* botones en bloque */
    .topActions{display:flex;gap:10px;margin-top:12px}
    .topActions button{flex:1}

    .filterRow{display:flex;gap:10px;margin-top:12px}
    .filterRow > *{flex:1}

    .listItem{
      border:1px solid rgba(11,45,92,.10);
      background:rgba(11,45,92,.03);
      border-radius:12px;
      padding:10px 12px;
      margin-top:10px;
    }
    .liTop{display:flex;justify-content:space-between;gap:10px;font-weight:900}
    .liSub{margin-top:6px;color:var(--muted);font-weight:800;font-size:12px;line-height:1.35}

    ::placeholder{color:rgba(11,45,92,.45)}

    /* ===== POPUP BUSY (BUSCANDO / GUARDANDO / OK / ERROR) ===== */
    .busyModal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.30);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:10000;
    }
    .busyBox{
      width:min(92vw, 360px);
      background:#fff;
      border:2px solid rgba(11,45,92,.18);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.20);
      padding:18px 16px;
      text-align:center;
      transform:scale(1);
      transition:transform .18s ease, background .25s ease, border-color .25s ease, color .25s ease;
      position:relative;
    }
    .busyBox.pop{
      animation:pop .18s ease;
    }
    @keyframes pop{
      0%{transform:scale(1)}
      60%{transform:scale(1.03)}
      100%{transform:scale(1)}
    }

    .busyText{
      margin-top:12px;
      font-weight:900;
      letter-spacing:.6px;
      color:var(--brand);
    }
    .busySpinner{
      width:34px;height:34px;
      border-radius:50%;
      border:4px solid rgba(11,45,92,.18);
      border-top-color: rgba(11,45,92,.80);
      margin:0 auto;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== CHECK ANIMADO ===== */
    .busyCheck{
      width:44px;height:44px;
      margin:0 auto;
      display:none;
    }
    .busyCheck svg{
      width:44px;height:44px;
      display:block;
    }
    .busyCheckCircle{
      fill:none;
      stroke:rgba(255,255,255,.95);
      stroke-width:4;
      stroke-linecap:round;
      stroke-dasharray:140;
      stroke-dashoffset:140;
      animation:drawCircle .42s ease forwards;
    }
    .busyCheckMark{
      fill:none;
      stroke:rgba(255,255,255,.95);
      stroke-width:5;
      stroke-linecap:round;
      stroke-linejoin:round;
      stroke-dasharray:60;
      stroke-dashoffset:60;
      animation:drawCheck .35s ease .18s forwards;
    }
    @keyframes drawCircle{
      to{stroke-dashoffset:0}
    }
    @keyframes drawCheck{
      to{stroke-dashoffset:0}
    }

    /* ===== ESTADO SUCCESS (VERDE) ===== */
    .busyBox.success{
      background:linear-gradient(135deg,#0F7A3A,#1BB15F);
      border-color:#0F7A3A;
      color:#fff;
    }
    .busyBox.success .busyText{ color:#fff; }
    .busyBox.success .busySpinner{ display:none; }
    .busyBox.success .busyCheck{ display:block; }

    /* ===== ESTADO ERROR (ROJO SUAVE) ===== */
    .busyBox.error{
      background:linear-gradient(135deg,#B00020,#E0354F);
      border-color:#B00020;
      color:#fff;
    }
    .busyBox.error .busyText{ color:#fff; }
    .busyBox.error .busySpinner{ display:none; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="brandTitle">PUBLICARTEL</div>
        <div class="brandSub">MOVIMIENTOS DE STOCK</div>
      </div>
      <div style="font-weight:900;opacity:.95;font-size:12px;letter-spacing:.5px;">STOCK</div>
    </div>

    <!-- SCREEN: FORM -->
    <div id="screenForm" class="card">

      <!-- MOVIMIENTOS ARRIBA (en bloque) -->
      <div class="topActions" style="margin-top:0;">
        <button id="btnVerMovs" type="button" class="btn-secondary">📄 MOVIMIENTOS</button>
      </div>

      <button id="btnScan" type="button" class="btn-secondary">📷 ESCANEAR</button>

      <label>CÓDIGO DE BARRAS</label>
      <input id="barcode" placeholder="ESCANEÁ O ESCRIBÍ..." />

      <div id="camWrap" class="camWrap">
        <video id="video" playsinline></video>
      </div>

      <div id="producto" class="hint"></div>

      <label>ORDEN (SOLO NÚMEROS)</label>
      <input id="orden" inputmode="numeric" pattern="[0-9]*" placeholder="EJ: 0" value="0" />

      <label>TIPO DE MOVIMIENTO</label>
      <select id="tipo_mov">
        <option value="" selected disabled>INGRESE TIPO DE MOVIMIENTO</option>
        <option value="SALIDA">SALIDA</option>
        <option value="ENTRADA">ENTRADA</option>
        <option value="AJUSTE">AJUSTE</option>
      </select>

      <label>CANTIDAD</label>
      <input id="cantidad" type="number" min="1" step="1" placeholder="INGRESE CANTIDAD" value="1" />

      <label>OBSERVACIÓN (OPCIONAL)</label>
      <textarea id="observacion" placeholder="NOTAS..."></textarea>

      <button id="btnGuardar" type="button" class="btn" disabled>✅ GUARDAR</button>

      <div id="msg" class="msg"></div>
    </div>

    <!-- SCREEN: MOVIMIENTOS -->
    <div id="screenList" class="card" style="display:none;">
      <div class="topActions">
        <button id="btnVolver" type="button" class="btn-secondary">⬅️ VOLVER</button>
        <button id="btnRefrescar" type="button" class="btn-secondary">🔄 REFRESCAR</button>
      </div>

      <div class="filterRow">
        <select id="fTipo">
          <option value="" selected>TODOS</option>
          <option value="ENTRADA">ENTRADA</option>
          <option value="SALIDA">SALIDA</option>
          <option value="AJUSTE">AJUSTE</option>
        </select>
        <input id="fQ" placeholder="BUSCAR (SKU / PROD / OBS)" />
      </div>

      <div class="filterRow">
        <input id="fFrom" type="date" />
        <input id="fTo" type="date" />
      </div>

      <button id="btnAplicarFiltros" type="button" class="btn-secondary">APLICAR FILTROS</button>

      <div id="listMsg" class="msg"></div>
      <div id="listContainer"></div>
    </div>
  </div>

  <!-- POPUP -->
  <div id="busyModal" class="busyModal">
    <div class="busyBox" id="busyBox">
      <div class="busySpinner" id="busySpinner"></div>

      <div class="busyCheck" id="busyCheck">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle class="busyCheckCircle" cx="26" cy="26" r="22"></circle>
          <path class="busyCheckMark" d="M16 27 L23 34 L37 19"></path>
        </svg>
      </div>

      <div id="busyText" class="busyText">PROCESANDO...</div>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const APPS_SCRIPT_URL = "PEGA_AQUI_TU_EXEC"; // <-- PEGÁ TU /exec
    const SECRET = "PUBLI_2026_Stock!";
    const REQUIRED_SAME_READS = 2;

    // ===== DOM =====
    const busyModalEl = document.getElementById("busyModal");
    const busyBoxEl = document.getElementById("busyBox");
    const busyTextEl = document.getElementById("busyText");

    const screenForm = document.getElementById("screenForm");
    const screenList = document.getElementById("screenList");

    const videoEl = document.getElementById("video");
    const camWrapEl = document.getElementById("camWrap");
    const btnScan = document.getElementById("btnScan");
    const btnGuardar = document.getElementById("btnGuardar");
    const btnVerMovs = document.getElementById("btnVerMovs");

    const ordenEl = document.getElementById("orden");
    const tipoMovEl = document.getElementById("tipo_mov");
    const barcodeEl = document.getElementById("barcode");
    const cantidadEl = document.getElementById("cantidad");
    const obsEl = document.getElementById("observacion");
    const productoEl = document.getElementById("producto");
    const msgEl = document.getElementById("msg");

    // list
    const btnVolver = document.getElementById("btnVolver");
    const btnRefrescar = document.getElementById("btnRefrescar");
    const btnAplicarFiltros = document.getElementById("btnAplicarFiltros");
    const fTipo = document.getElementById("fTipo");
    const fQ = document.getElementById("fQ");
    const fFrom = document.getElementById("fFrom");
    const fTo = document.getElementById("fTo");
    const listMsgEl = document.getElementById("listMsg");
    const listContainer = document.getElementById("listContainer");

    // ===== STATE =====
    let currentProducto = null;   // { sku, descripcion }
    let currentBarcode = "";
    let currentStock = null;

    // cache navegador (instantáneo al repetir)
    const memLookup = new Map(); // barcode -> {sku, descripcion, stock, t}

    // scanner
    let stream = null;
    let detector = null;
    let scanning = false;
    let rafId = null;
    let lastCode = "";
    let sameCount = 0;

    // popup mínimo visible
    let busyShownAt = 0;
    const BUSY_MIN_MS = 250;

    function resetBusyStyle(){
      busyBoxEl.classList.remove("success","error");
    }
    function popBusy(){
      busyBoxEl.classList.remove("pop");
      // reflow para reiniciar animación
      void busyBoxEl.offsetWidth;
      busyBoxEl.classList.add("pop");
    }

    function showBusy(text="PROCESANDO..."){
      busyShownAt = Date.now();
      resetBusyStyle();
      busyTextEl.textContent = (text||"").toString().toUpperCase();
      busyModalEl.style.display = "flex";
      popBusy();
    }
    function hideBusy(){
      const elapsed = Date.now() - busyShownAt;
      const wait = Math.max(0, BUSY_MIN_MS - elapsed);
      setTimeout(()=>{
        busyModalEl.style.display = "none";
        resetBusyStyle();
      }, wait);
    }
    function setBusyText(text=""){
      busyTextEl.textContent = (text||"").toString().toUpperCase();
    }
    function setBusySuccess(text="✅ OK"){
      busyBoxEl.classList.add("success");
      setBusyText(text);
      popBusy();
      navigator.vibrate?.(60);
    }
    function setBusyError(text="❌ ERROR"){
      busyBoxEl.classList.add("error");
      setBusyText(text);
      popBusy();
      navigator.vibrate?.(120);
    }

    function setMsg(t="", err=false){
      msgEl.className = "msg" + (err ? " err" : "");
      msgEl.textContent = (t||"").toString().toUpperCase();
    }
    function setListMsg(t="", err=false){
      listMsgEl.className = "msg" + (err ? " err" : "");
      listMsgEl.textContent = (t||"").toString().toUpperCase();
    }

    function setProducto(producto, barcode, stock){
      currentProducto = producto || null;
      currentBarcode = producto ? (barcode || "") : "";
      currentStock = (typeof stock === "number") ? stock : null;

      if (!producto){
        productoEl.style.display = "none";
        productoEl.innerHTML = "";
        btnGuardar.disabled = true;
        return;
      }

      const line1 = `PRODUCTO: ${producto.descripcion||"-"} | SKU: ${producto.sku||"-"}`;
      const line2 = (typeof stock === "number") ? `STOCK ACTUAL: ${stock}` : `STOCK ACTUAL: ...`;

      productoEl.innerHTML = `<div>${line1}</div><div class="line2">${line2}</div>`;
      productoEl.style.display = "block";
      btnGuardar.disabled = false;
    }

    async function apiGet_(params){
      const url = `${APPS_SCRIPT_URL}?` + new URLSearchParams(params).toString();
      const res = await fetch(url, { cache:"no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "ERROR");
      return j;
    }

    async function fetchLookup(barcode){
      return await apiGet_({ action:"lookup", secret:SECRET, barcode });
    }

    async function handleBarcode(code){
      const clean = String(code||"").trim();
      if (!clean) return;

      barcodeEl.value = clean;

      // cache navegador 15s (igual mostramos feedback)
      const hit = memLookup.get(clean);
      if (hit && (Date.now() - hit.t) < 15000){
        showBusy("BUSCANDO PRODUCTO...");
        setProducto({ sku: hit.sku, descripcion: hit.descripcion }, clean, hit.stock);
        setMsg("", false);
        cantidadEl.focus();
        cantidadEl.select?.();
        setBusySuccess("✅ ENCONTRADO");
        setTimeout(()=> hideBusy(), 380);
        return;
      }

      showBusy("BUSCANDO PRODUCTO...");
      setMsg("", false);
      setProducto(null,"",null);

      try{
        const j = await fetchLookup(clean);
        const producto = { sku: j.sku, descripcion: j.descripcion };
        const stock = Number(j.stock || 0);

        memLookup.set(clean, { sku: producto.sku, descripcion: producto.descripcion, stock, t: Date.now() });

        setProducto(producto, clean, stock);
        setMsg("", false);
        cantidadEl.focus();
        cantidadEl.select?.();

        setBusySuccess("✅ ENCONTRADO");
        setTimeout(()=> hideBusy(), 380);
      }catch(e){
        setProducto(null,"",null);
        setMsg(String(e.message || e).toUpperCase(), true);

        setBusyError("❌ NO SE PUDO");
        setTimeout(()=> hideBusy(), 650);
      }
    }

    async function initDetector(){
      if (!("BarcodeDetector" in window)) throw new Error("BARCODEDETECTOR NO DISPONIBLE");
      const formats = await BarcodeDetector.getSupportedFormats();
      detector = new BarcodeDetector({ formats });
    }

    async function startCamera(){
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} },
        audio:false
      });
      videoEl.srcObject = stream;
      await videoEl.play();
    }

    function stopCamera(){
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (stream) stream.getTracks().forEach(t=>t.stop());
      stream = null;
      videoEl.srcObject = null;
    }

    async function scanLoop(){
      if (!scanning) return;
      try{
        const barcodes = await detector.detect(videoEl);
        if (barcodes?.length){
          const code = (barcodes[0].rawValue || "").trim();
          if (code){
            if (code === lastCode) sameCount++;
            else { lastCode=code; sameCount=1; }

            if (sameCount >= REQUIRED_SAME_READS){
              stopScan();
              await handleBarcode(code);
              return;
            }
          }
        }
      }catch(e){}
      rafId = requestAnimationFrame(scanLoop);
    }

    async function startScan(){
      if (scanning) return;
      scanning = true;
      btnScan.textContent = "🛑 DETENER";
      lastCode=""; sameCount=0;

      try{
        await initDetector();
        camWrapEl.style.display = "block";
        await startCamera();
        rafId = requestAnimationFrame(scanLoop);
      }catch(e){
        scanning=false;
        btnScan.textContent="📷 ESCANEAR";
        camWrapEl.style.display="none";
        stopCamera();
        setMsg("ERROR DE CÁMARA / PERMISOS", true);
      }
    }

    function stopScan(){
      scanning=false;
      btnScan.textContent="📷 ESCANEAR";
      stopCamera();
      camWrapEl.style.display="none";
    }

    function limpiarCampos(){
      if (!ordenEl.value.trim()) ordenEl.value = "0";
      barcodeEl.value = "";
      obsEl.value = "";
      cantidadEl.value = "1";
      setProducto(null,"",null);
    }

    async function guardarMovimiento(){
      const orden = ordenEl.value.trim() || "0";
      const tipo_mov = (tipoMovEl.value || "").trim().toUpperCase();
      const barcode = barcodeEl.value.trim();
      const cantidad = (cantidadEl.value || "").trim();
      const observacion = (obsEl.value || "").trim().toUpperCase();

      if (!currentProducto || currentBarcode !== barcode) { btnGuardar.disabled = true; return; }
      if (!tipo_mov || !barcode || !cantidad || Number(cantidad) <= 0) { setMsg("FALTAN DATOS", true); return; }

      btnGuardar.disabled = true;

      const data = {
        secret: SECRET,
        orden,
        tipo_mov,
        barcode,
        cantidad,
        observacion,
        sku: currentProducto.sku,
        descripcion: currentProducto.descripcion,
        usuario:""
      };

      try{
        showBusy("GUARDANDO MOVIMIENTO...");

        await fetch(APPS_SCRIPT_URL, {
          method:"POST",
          mode:"no-cors",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(data)
        });

        // invalida cache local para no mostrar stock viejo
        memLookup.delete(barcode);

        setBusySuccess("✅ GUARDADO");
        setTimeout(()=> hideBusy(), 700);

        setMsg("", false);
        limpiarCampos();
      }catch(e){
        setBusyError("❌ ERROR AL GUARDAR");
        setTimeout(()=> hideBusy(), 900);
        setMsg("ERROR AL ENVIAR", true);
      }finally{
        btnGuardar.disabled = !currentProducto;
      }
    }

    function fmtFecha(iso){
      try{
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        const dd = String(d.getDate()).padStart(2,"0");
        const mm = String(d.getMonth()+1).padStart(2,"0");
        const yy = d.getFullYear();
        const hh = String(d.getHours()).padStart(2,"0");
        const mi = String(d.getMinutes()).padStart(2,"0");
        return `${dd}/${mm}/${yy} ${hh}:${mi}`;
      }catch{ return iso; }
    }

    async function cargarMovimientos(){
      setListMsg("CARGANDO...", false);
      listContainer.innerHTML = "";

      const tipo = (fTipo.value || "").trim();
      const q = (fQ.value || "").trim();
      const from = (fFrom.value || "").trim();
      const to = (fTo.value || "").trim();

      try{
        const j = await apiGet_({
          action:"list",
          secret:SECRET,
          limit:"120",
          tipo,
          q,
          from,
          to
        });

        const items = j.items || [];
        if (!items.length){ setListMsg("SIN RESULTADOS", false); return; }

        setListMsg("", false);
        for (const it of items){
          const fecha = fmtFecha(it.timestamp);
          const tipoMov = String(it.tipo_mov||"");
          const prod = String(it.descripcion||"");
          const cant = Number(it.cantidad||0);
          const obs = String(it.observacion||"");

          const div = document.createElement("div");
          div.className = "listItem";
          div.innerHTML = `
            <div class="liTop"><div>${fecha}</div><div>${tipoMov}</div></div>
            <div class="liSub">${prod}</div>
            <div class="liSub">CANTIDAD: ${cant}${obs ? " | OBS: " + obs : ""}</div>
          `;
          listContainer.appendChild(div);
        }
      }catch(e){
        setListMsg(("NO SE PUDO CARGAR: " + (e.message||e)), true);
      }
    }

    // ===== EVENTS =====
    btnScan.addEventListener("click", ()=> scanning ? stopScan() : startScan());

    ordenEl.addEventListener("input", ()=> { ordenEl.value = ordenEl.value.replace(/\D/g,""); });
    ordenEl.addEventListener("blur", ()=> { if (!ordenEl.value.trim()) ordenEl.value = "0"; });

    barcodeEl.addEventListener("change", async ()=>{
      await handleBarcode(barcodeEl.value);
    });

    btnGuardar.addEventListener("click", guardarMovimiento);

    btnVerMovs.addEventListener("click", async ()=>{
      screenForm.style.display="none";
      screenList.style.display="block";
      await cargarMovimientos();
    });

    btnVolver.addEventListener("click", ()=>{
      screenList.style.display="none";
      screenForm.style.display="block";
    });

    btnRefrescar.addEventListener("click", cargarMovimientos);
    btnAplicarFiltros.addEventListener("click", cargarMovimientos);

    // INIT
    ordenEl.value = "0";
    setProducto(null,"",null);
    setMsg("", false);
  </script>
</body>
</html>
