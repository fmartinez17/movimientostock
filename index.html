<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PUBLICARTEL · MOVIMIENTOS</title>
  <style>
    :root{
      --brand:#0B2D5C;
      --brand2:#154B9A;
      --bg:#F3F6FB;
      --card:#FFFFFF;
      --text:#0B2D5C;
      --muted:rgba(11,45,92,.70);
      --border:rgba(11,45,92,.28);
      --danger:#B00020;
      --ok:#0F7A3A;
      --shadow:0 10px 30px rgba(11,45,92,.10);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);text-transform:uppercase}
    .wrap{max-width:560px;margin:0 auto;padding:16px}

    /* top user bar */
    .userBar{
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .userChip{
      flex:1;
      background:#fff;
      border:2px solid rgba(11,45,92,.14);
      border-radius:14px;
      padding:10px 12px;
      box-shadow:var(--shadow);
      font-weight:900;
      letter-spacing:.4px;
    }
    .logoutBtn{
      width:auto;
      padding:10px 12px;
      border-radius:14px;
      border:2px solid rgba(176,0,32,.30);
      color:#B00020;
      background:#fff;
      font-weight:900;
      cursor:pointer;
      box-shadow:none;
    }

    .header{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;border-radius:var(--radius);
      padding:16px 14px;box-shadow:var(--shadow);
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .brandTitle{font-weight:900;letter-spacing:.6px;font-size:18px;line-height:1.1}
    .brandSub{font-size:12px;opacity:.92;margin-top:4px;letter-spacing:.4px}

    .card{
      margin-top:14px;background:var(--card);border-radius:var(--radius);padding:14px;
      box-shadow:var(--shadow);border:1px solid rgba(11,45,92,.08)
    }

    label{display:block;margin-top:12px;font-weight:900;font-size:12px;letter-spacing:.4px;color:var(--muted)}
    input,select,textarea,button{
      width:100%;padding:12px;margin-top:6px;border-radius:12px;border:2px solid var(--border);
      font-size:16px;text-transform:uppercase;background:#fff;color:var(--text);outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:rgba(21,75,154,.65);box-shadow:0 0 0 3px rgba(21,75,154,.12)}
    textarea{min-height:76px;resize:vertical}

    .btn{
      border:none;font-weight:900;letter-spacing:.7px;cursor:pointer;
      background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
      box-shadow:0 10px 20px rgba(11,45,92,.14)
    }
    .btn-secondary{
      background:#fff;color:var(--brand);border:2px solid var(--border);box-shadow:none;font-weight:900
    }
    .btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}

    .navBlocks{display:flex;flex-direction:column;gap:10px;margin-top:0;}
    .navBlocks button{margin-top:0;width:100%;}

    .camWrap{
      display:none;margin-top:12px;border-radius:var(--radius);overflow:hidden;
      border:2px solid var(--border);background:#000
    }
    video{width:100%;height:320px;object-fit:cover;display:block;background:#000}

    .hint{
      display:none;margin-top:10px;padding:10px 12px;border-radius:12px;
      background:rgba(11,45,92,.06);border:1px solid rgba(11,45,92,.10);
      font-weight:900
    }
    .hint .line2{margin-top:6px;color:var(--muted);font-size:12px;font-weight:900}

    .msg{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px;letter-spacing:.3px}
    .msg.err{color:var(--danger);font-weight:900}

    .topActions{display:flex;gap:10px;margin-top:12px}
    .topActions button{flex:1}

    .filterRow{display:flex;gap:10px;margin-top:12px}
    .filterRow > *{flex:1}

    .listItem{
      border:1px solid rgba(11,45,92,.10);
      background:rgba(11,45,92,.03);
      border-radius:12px;
      padding:10px 12px;
      margin-top:10px;
    }
    .listItem.in{ background:rgba(15,122,58,.10); border-color:rgba(15,122,58,.22); }
    .listItem.out{ background:rgba(176,0,32,.10); border-color:rgba(176,0,32,.22); }
    .listItem.adj{ background:rgba(240,180,0,.14); border-color:rgba(240,180,0,.28); }

    .liTop{display:flex;justify-content:space-between;gap:10px;font-weight:900}
    .liSub{margin-top:6px;color:var(--muted);font-weight:800;font-size:12px;line-height:1.35}

    /* PRODUCTOS layout */
    .prodItem{
      display:grid;
      grid-template-columns: 1fr 120px;
      gap:10px;
      align-items:center;
    }
    .prodLeft .skuLine{font-weight:900;letter-spacing:.4px;}
    .prodLeft .descLine{margin-top:6px;color:var(--muted);font-weight:900;font-size:12px;line-height:1.25}
    .prodLeft .codeLine{margin-top:6px;color:rgba(11,45,92,.78);font-weight:900;font-size:12px;letter-spacing:.4px}
    .prodRight{
      text-align:right;
      border-left:1px solid rgba(11,45,92,.12);
      padding-left:10px;
    }
    .prodRight .stkLbl{font-weight:900;font-size:12px;letter-spacing:.6px;color:rgba(176,0,32,.85)}
    .prodRight .stkNum{margin-top:4px;font-weight:900;font-size:22px;letter-spacing:.6px;color:var(--danger)}

    ::placeholder{color:rgba(11,45,92,.45)}

    /* popup busy */
    .busyModal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.30);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:10000;
    }
    .busyBox{
      width:min(92vw, 360px);
      background:#fff;
      border:2px solid rgba(11,45,92,.18);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.20);
      padding:18px 16px;
      text-align:center;
      transform:scale(1);
      transition:transform .18s ease, background .25s ease, border-color .25s ease, color .25s ease;
      position:relative;
    }
    .busyBox.pop{ animation:pop .18s ease; }
    @keyframes pop{
      0%{transform:scale(1)}
      60%{transform:scale(1.03)}
      100%{transform:scale(1)}
    }
    .busyText{
      margin-top:12px;
      font-weight:900;
      letter-spacing:.6px;
      color:var(--brand);
    }
    .busySpinner{
      width:34px;height:34px;
      border-radius:50%;
      border:4px solid rgba(11,45,92,.18);
      border-top-color: rgba(11,45,92,.80);
      margin:0 auto;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .busyCheck{width:44px;height:44px;margin:0 auto;display:none;}
    .busyCheck svg{width:44px;height:44px;display:block;}
    .busyCheckCircle{
      fill:none;stroke:rgba(255,255,255,.95);stroke-width:4;stroke-linecap:round;
      stroke-dasharray:140;stroke-dashoffset:140;animation:drawCircle .42s ease forwards;
    }
    .busyCheckMark{
      fill:none;stroke:rgba(255,255,255,.95);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
      stroke-dasharray:60;stroke-dashoffset:60;animation:drawCheck .35s ease .18s forwards;
    }
    @keyframes drawCircle{ to{stroke-dashoffset:0} }
    @keyframes drawCheck{ to{stroke-dashoffset:0} }

    .busyBox.success{background:linear-gradient(135deg,#0F7A3A,#1BB15F);border-color:#0F7A3A;color:#fff;}
    .busyBox.success .busyText{color:#fff;}
    .busyBox.success .busySpinner{display:none;}
    .busyBox.success .busyCheck{display:block;}

    .busyBox.error{background:linear-gradient(135deg,#B00020,#E0354F);border-color:#B00020;color:#fff;}
    .busyBox.error .busyText{color:#fff;}
    .busyBox.error .busySpinner{display:none;}

    .adjustMode{
      border-color: rgba(15,122,58,.55) !important;
      box-shadow:0 0 0 3px rgba(15,122,58,.12) !important;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- USER BAR -->
    <div id="userBar" class="userBar">
      <div id="userChip" class="userChip">👤</div>
      <button id="btnLogout" class="logoutBtn" type="button">🚪 CERRAR SESIÓN</button>
    </div>

    <div class="header">
      <div>
        <div class="brandTitle">PUBLICARTEL</div>
        <div class="brandSub">MOVIMIENTOS DE STOCK</div>
      </div>
      <div style="font-weight:900;opacity:.95;font-size:12px;letter-spacing:.5px;">STOCK</div>
    </div>

    <!-- SCREEN: LOGIN -->
    <div id="screenLogin" class="card" style="display:none;">
      <label>USUARIO</label>
      <input id="loginUsuario" placeholder="INGRESE USUARIO" autocomplete="username" />

      <label>CLAVE</label>
      <input id="loginClave" placeholder="INGRESE CLAVE" type="password" autocomplete="current-password" />

      <button id="btnLogin" type="button" class="btn">✅ INICIAR SESIÓN</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- SCREEN: FORM -->
    <div id="screenForm" class="card" style="display:none;">
      <div class="navBlocks">
        <button id="btnVerMovs" type="button" class="btn-secondary">📋 MOVIMIENTOS</button>
        <button id="btnAddProd" type="button" class="btn-secondary">➕ NUEVO PRODUCTO</button>
        <button id="btnProductos" type="button" class="btn-secondary">📦 PRODUCTOS</button>
      </div>

      <button id="btnScan" type="button" class="btn-secondary">📷 ESCANEAR</button>

      <label>CÓDIGO DE BARRAS</label>
      <input id="barcode" placeholder="ESCANEÁ O ESCRIBÍ..." />

      <div id="camWrap" class="camWrap">
        <video id="video" playsinline></video>
      </div>

      <div id="producto" class="hint"></div>

      <label>ORDEN (SOLO NÚMEROS)</label>
      <input id="orden" inputmode="numeric" pattern="[0-9]*" placeholder="EJ: 0" value="0" />

      <label>TIPO DE MOVIMIENTO</label>
      <select id="tipo_mov">
        <option value="" selected disabled>INGRESE TIPO DE MOVIMIENTO</option>
        <option value="SALIDA">SALIDA</option>
        <option value="ENTRADA">ENTRADA</option>
        <option value="AJUSTE">AJUSTE (STOCK REAL)</option>
      </select>

      <label id="lblCantidad">CANTIDAD</label>
      <input id="cantidad" type="number" min="0" step="1" placeholder="INGRESE SU CANTIDAD" value="" />

      <label>OBSERVACIÓN (OPCIONAL)</label>
      <textarea id="observacion" placeholder="NOTAS..."></textarea>

      <button id="btnGuardar" type="button" class="btn" disabled>✅ GUARDAR</button>

      <div id="msg" class="msg"></div>
    </div>

    <!-- SCREEN: MOVIMIENTOS -->
    <div id="screenList" class="card" style="display:none;">
      <div class="topActions">
        <button id="btnVolver" type="button" class="btn-secondary">⬅️ VOLVER</button>
        <button id="btnRefrescar" type="button" class="btn-secondary">🔄 REFRESCAR</button>
      </div>

      <div class="filterRow">
        <select id="fTipo">
          <option value="" selected>TODOS</option>
          <option value="ENTRADA">ENTRADA</option>
          <option value="SALIDA">SALIDA</option>
        </select>
        <input id="fQ" placeholder="BUSCAR (SKU / PROD / OBS / USUARIO)" />
      </div>

      <div class="filterRow">
        <input id="fFrom" type="date" />
        <input id="fTo" type="date" />
      </div>

      <button id="btnAplicarFiltros" type="button" class="btn-secondary">APLICAR FILTROS</button>

      <div id="listMsg" class="msg"></div>
      <div id="listContainer"></div>
    </div>

    <!-- SCREEN: AGREGAR PRODUCTO -->
    <div id="screenAdd" class="card" style="display:none;">
      <div class="topActions" style="margin-top:0;">
        <button id="btnBackAdd" type="button" class="btn-secondary">⬅️ VOLVER</button>
        <button id="btnScanAdd" type="button" class="btn-secondary">📷 ESCANEAR</button>
      </div>

      <label>CÓDIGO DE BARRAS</label>
      <input id="add_barcode" placeholder="ESCANEÁ O ESCRIBÍ..." />

      <div id="camWrapAdd" class="camWrap">
        <video id="videoAdd" playsinline></video>
      </div>

      <div id="productoAddHint" class="hint"></div>

      <label>SKU</label>
      <input id="add_sku" placeholder="INGRESE SKU" />

      <label>DESCRIPCIÓN</label>
      <input id="add_desc" placeholder="INGRESE DESCRIPCIÓN" />

      <button id="btnGuardarProd" type="button" class="btn">✅ GUARDAR PRODUCTO</button>

      <div id="addMsg" class="msg"></div>
    </div>

    <!-- SCREEN: PRODUCTOS -->
    <div id="screenProductos" class="card" style="display:none;">
      <div class="topActions" style="margin-top:0;">
        <button id="btnVolverProd" type="button" class="btn-secondary">⬅️ VOLVER</button>
        <button id="btnRefrescarProd" type="button" class="btn-secondary">🔄 REFRESCAR</button>
      </div>

      <label>BUSCAR</label>
      <input id="pQ" placeholder="BUSCAR (BARCODE / SKU / DESCRIPCIÓN)" />
      <button id="btnBuscarProd" type="button" class="btn-secondary">🔎 BUSCAR</button>

      <div id="prodMsg" class="msg"></div>
      <div id="prodContainer"></div>
    </div>
  </div>

  <!-- POPUP -->
  <div id="busyModal" class="busyModal">
    <div class="busyBox" id="busyBox">
      <div class="busySpinner"></div>
      <div class="busyCheck">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle class="busyCheckCircle" cx="26" cy="26" r="22"></circle>
          <path class="busyCheckMark" d="M16 27 L23 34 L37 19"></path>
        </svg>
      </div>
      <div id="busyText" class="busyText">PROCESANDO...</div>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydj9DjLAavuTV2KtNIW__pioG01-a4N9XDhEhlL9mhWai_RWj4pAZJEP4pCr4a21Jf/exec";
    const SECRET = "PUBLI_2026_Stock!";
    const REQUIRED_SAME_READS = 2;

    // ===== STORAGE KEYS =====
    const LS_TOKEN = "PUBLI_TOKEN";
    const LS_NAME  = "PUBLI_NAME";   // "NOMBRE APELLIDO"
    const LS_USER  = "PUBLI_USER";   // usuario login

    // ===== DOM =====
    const userBarEl  = document.getElementById("userBar");
    const userChipEl = document.getElementById("userChip");
    const btnLogout  = document.getElementById("btnLogout");

    const busyModalEl = document.getElementById("busyModal");
    const busyBoxEl = document.getElementById("busyBox");
    const busyTextEl = document.getElementById("busyText");

    const screenLogin = document.getElementById("screenLogin");
    const screenForm = document.getElementById("screenForm");
    const screenList = document.getElementById("screenList");
    const screenAdd  = document.getElementById("screenAdd");
    const screenProductos = document.getElementById("screenProductos");

    const loginUsuarioEl = document.getElementById("loginUsuario");
    const loginClaveEl = document.getElementById("loginClave");
    const btnLogin = document.getElementById("btnLogin");
    const loginMsgEl = document.getElementById("loginMsg");

    const videoEl = document.getElementById("video");
    const camWrapEl = document.getElementById("camWrap");
    const videoAddEl = document.getElementById("videoAdd");
    const camWrapAddEl = document.getElementById("camWrapAdd");

    const btnScan = document.getElementById("btnScan");
    const btnScanAdd = document.getElementById("btnScanAdd");

    const btnGuardar = document.getElementById("btnGuardar");
    const btnVerMovs = document.getElementById("btnVerMovs");
    const btnAddProd = document.getElementById("btnAddProd");
    const btnProductos = document.getElementById("btnProductos");

    const ordenEl = document.getElementById("orden");
    const tipoMovEl = document.getElementById("tipo_mov");
    const barcodeEl = document.getElementById("barcode");
    const cantidadEl = document.getElementById("cantidad");
    const lblCantidadEl = document.getElementById("lblCantidad");
    const obsEl = document.getElementById("observacion");
    const productoEl = document.getElementById("producto");
    const msgEl = document.getElementById("msg");

    // list
    const btnVolver = document.getElementById("btnVolver");
    const btnRefrescar = document.getElementById("btnRefrescar");
    const btnAplicarFiltros = document.getElementById("btnAplicarFiltros");
    const fTipo = document.getElementById("fTipo");
    const fQ = document.getElementById("fQ");
    const fFrom = document.getElementById("fFrom");
    const fTo = document.getElementById("fTo");
    const listMsgEl = document.getElementById("listMsg");
    const listContainer = document.getElementById("listContainer");

    // add product
    const btnBackAdd = document.getElementById("btnBackAdd");
    const addBarcodeEl = document.getElementById("add_barcode");
    const addSkuEl = document.getElementById("add_sku");
    const addDescEl = document.getElementById("add_desc");
    const btnGuardarProd = document.getElementById("btnGuardarProd");
    const addMsgEl = document.getElementById("addMsg");
    const productoAddHintEl = document.getElementById("productoAddHint");

    // productos
    const btnVolverProd = document.getElementById("btnVolverProd");
    const btnRefrescarProd = document.getElementById("btnRefrescarProd");
    const btnBuscarProd = document.getElementById("btnBuscarProd");
    const pQEl = document.getElementById("pQ");
    const prodMsgEl = document.getElementById("prodMsg");
    const prodContainer = document.getElementById("prodContainer");

    // ===== STATE =====
    let currentProducto = null;
    let currentBarcode = "";
    let currentStock = null;
    const memLookup = new Map();

    // scanner
    let stream = null;
    let detector = null;
    let scanning = false;
    let rafId = null;
    let lastCode = "";
    let sameCount = 0;
    let scanTarget = "MOV";

    // busy
    let busyShownAt = 0;
    const BUSY_MIN_MS = 250;

    // catálogo cache
    let catalogCache = [];

    // ===== HELPERS UI =====
    function resetBusyStyle(){ busyBoxEl.classList.remove("success","error"); }
    function popBusy(){
      busyBoxEl.classList.remove("pop");
      void busyBoxEl.offsetWidth;
      busyBoxEl.classList.add("pop");
    }
    function showBusy(text="PROCESANDO..."){
      busyShownAt = Date.now();
      resetBusyStyle();
      busyTextEl.textContent = String(text||"").toUpperCase();
      busyModalEl.style.display = "flex";
      popBusy();
    }
    function hideBusy(){
      const elapsed = Date.now() - busyShownAt;
      const wait = Math.max(0, BUSY_MIN_MS - elapsed);
      setTimeout(()=>{
        busyModalEl.style.display = "none";
        resetBusyStyle();
      }, wait);
    }
    function setBusyText(text=""){ busyTextEl.textContent = String(text||"").toUpperCase(); }
    function setBusySuccess(text="✅ OK"){
      busyBoxEl.classList.add("success");
      setBusyText(text);
      popBusy();
      navigator.vibrate?.(60);
    }
    function setBusyError(text="❌ ERROR"){
      busyBoxEl.classList.add("error");
      setBusyText(text);
      popBusy();
      navigator.vibrate?.(120);
    }

    function setMsg(t="", err=false){ msgEl.className = "msg" + (err ? " err":""); msgEl.textContent = String(t||"").toUpperCase(); }
    function setLoginMsg(t="", err=false){ loginMsgEl.className = "msg" + (err ? " err":""); loginMsgEl.textContent = String(t||"").toUpperCase(); }
    function setListMsg(t="", err=false){ listMsgEl.className = "msg" + (err ? " err":""); listMsgEl.textContent = String(t||"").toUpperCase(); }
    function setAddMsg(t="", err=false){ addMsgEl.className = "msg" + (err ? " err":""); addMsgEl.textContent = String(t||"").toUpperCase(); }
    function setProdMsg(t="", err=false){ prodMsgEl.className = "msg" + (err ? " err":""); prodMsgEl.textContent = String(t||"").toUpperCase(); }

    function showOnly(screen){
      screenLogin.style.display = (screen === "LOGIN") ? "block" : "none";
      screenForm.style.display = (screen === "FORM") ? "block" : "none";
      screenList.style.display = (screen === "LIST") ? "block" : "none";
      screenAdd.style.display = (screen === "ADD") ? "block" : "none";
      screenProductos.style.display = (screen === "PRODUCTOS") ? "block" : "none";
    }

    function setUserBarVisible_(visible){
      userBarEl.style.display = visible ? "flex" : "none";
    }

    function setUserChip_(nombreApellido){
      userChipEl.textContent = ("👤 " + String(nombreApellido||"")).toUpperCase();
    }

    function getToken_(){ return localStorage.getItem(LS_TOKEN) || ""; }
    function setSession_(token, usuario, nombre, apellido){
      localStorage.setItem(LS_TOKEN, token);
      localStorage.setItem(LS_USER, usuario || "");
      localStorage.setItem(LS_NAME, ((nombre||"") + " " + (apellido||"")).trim());
    }
    function clearSession_(){
      localStorage.removeItem(LS_TOKEN);
      localStorage.removeItem(LS_USER);
      localStorage.removeItem(LS_NAME);
    }

    function resetTipoYcantidadUI_(){
      tipoMovEl.value = "";
      lblCantidadEl.textContent = "CANTIDAD";
      cantidadEl.placeholder = "INGRESE SU CANTIDAD";
      cantidadEl.value = "";
      cantidadEl.classList.remove("adjustMode");
      btnGuardar.textContent = "✅ GUARDAR";
    }
    function resetOrden_(){ ordenEl.value = "0"; }
    function resetFormAfterAction_(){ resetOrden_(); resetTipoYcantidadUI_(); }

    function setProducto(producto, barcode, stock){
      currentProducto = producto || null;
      currentBarcode = producto ? (barcode || "") : "";
      currentStock = (typeof stock === "number") ? stock : null;

      if (!producto){
        productoEl.style.display = "none";
        productoEl.innerHTML = "";
        btnGuardar.disabled = true;
        return;
      }

      const line1 = `PRODUCTO: ${producto.descripcion||"-"} | SKU: ${producto.sku||"-"}`;
      const line2 = (typeof stock === "number") ? `STOCK ACTUAL: ${stock}` : `STOCK ACTUAL: ...`;
      productoEl.innerHTML = `<div>${line1}</div><div class="line2">${line2}</div>`;
      productoEl.style.display = "block";
      btnGuardar.disabled = false;
    }

    // ===== API =====
    async function apiGet_(params){
      const token = getToken_();
      const url = `${APPS_SCRIPT_URL}?` + new URLSearchParams({ ...params, secret: SECRET, token }).toString();
      const res = await fetch(url, { cache:"no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "ERROR");
      return j;
    }

    async function apiLogin_(usuario, clave){
      const url = `${APPS_SCRIPT_URL}?` + new URLSearchParams({
        action:"login",
        secret: SECRET,
        usuario,
        clave
      }).toString();

      const res = await fetch(url, { cache:"no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "ERROR");
      return j;
    }

    async function apiLogout_(){
      const token = getToken_();
      if (!token) return;
      const url = `${APPS_SCRIPT_URL}?` + new URLSearchParams({
        action:"logout",
        secret: SECRET,
        token
      }).toString();
      try{ await fetch(url, { cache:"no-store" }); }catch{}
    }

    async function apiMe_(){
      return await apiGet_({ action:"me" });
    }

    async function fetchLookup(barcode){
      return await apiGet_({ action:"lookup", barcode });
    }
    async function catFind(barcode){
      return await apiGet_({ action:"catfind", barcode });
    }
    async function fetchCatalog_(){
      return await apiGet_({ action:"catalog" });
    }

    // ===== LOGIN FLOW =====
    async function enterApp_(){
      // valida session actual
      const token = getToken_();
      if (!token){
        setUserBarVisible_(false);
        showOnly("LOGIN");
        loginUsuarioEl.focus();
        return;
      }

      showBusy("VALIDANDO SESIÓN...");
      try{
        const me = await apiMe_();
        const full = ((me.nombre||"") + " " + (me.apellido||"")).trim();
        setUserChip_(full || localStorage.getItem(LS_NAME) || "USUARIO");
        setUserBarVisible_(true);
        showOnly("FORM");
        setBusySuccess("✅ OK");
        setTimeout(()=> hideBusy(), 250);
      }catch(e){
        clearSession_();
        setUserBarVisible_(false);
        showOnly("LOGIN");
        setBusyError("❌ SESIÓN");
        setTimeout(()=> hideBusy(), 450);
      }
    }

    async function doLogin_(){
      const usuario = String(loginUsuarioEl.value||"").trim();
      const clave = String(loginClaveEl.value||"").trim();
      if (!usuario || !clave){
        setLoginMsg("FALTAN DATOS", true);
        return;
      }

      setLoginMsg("", false);
      showBusy("INICIANDO SESIÓN...");
      try{
        const j = await apiLogin_(usuario, clave);
        setSession_(j.token, j.usuario, j.nombre, j.apellido);

        setUserChip_((j.nombre + " " + j.apellido).trim());
        setUserBarVisible_(true);

        loginClaveEl.value = "";
        setLoginMsg("", false);

        setBusySuccess("✅ BIENVENIDO");
        setTimeout(()=> hideBusy(), 350);

        showOnly("FORM");
      }catch(e){
        setBusyError("❌ ERROR");
        setTimeout(()=> hideBusy(), 650);
        setLoginMsg(e.message || e, true);
      }
    }

    async function doLogoutAndGoLogin_(){
      stopScan();
      showBusy("CERRANDO SESIÓN...");
      try{
        await apiLogout_();
      }catch{}
      clearSession_();
      setUserBarVisible_(false);
      setBusySuccess("✅ LISTO");
      setTimeout(()=> hideBusy(), 300);
      showOnly("LOGIN");
      loginUsuarioEl.focus();
    }

    // ===== MOVIMIENTOS =====
    async function handleBarcode_MOV(code){
      const clean = String(code||"").trim();
      if (!clean) return;

      barcodeEl.value = clean;
      resetFormAfterAction_();

      const hit = memLookup.get(clean);
      if (hit && (Date.now() - hit.t) < 15000){
        showBusy("BUSCANDO PRODUCTO...");
        setProducto({ sku: hit.sku, descripcion: hit.descripcion }, clean, hit.stock);
        setMsg("", false);
        cantidadEl.focus();
        setBusySuccess("✅ ENCONTRADO");
        setTimeout(()=> hideBusy(), 380);
        return;
      }

      showBusy("BUSCANDO PRODUCTO...");
      setMsg("", false);
      setProducto(null,"",null);

      try{
        const j = await fetchLookup(clean);
        const producto = { sku: j.sku, descripcion: j.descripcion };
        const stock = Number(j.stock || 0);
        memLookup.set(clean, { sku: producto.sku, descripcion: producto.descripcion, stock, t: Date.now() });

        setProducto(producto, clean, stock);
        setMsg("", false);
        cantidadEl.focus();

        setBusySuccess("✅ ENCONTRADO");
        setTimeout(()=> hideBusy(), 380);
      }catch(e){
        setProducto(null,"",null);
        setMsg(String(e.message || e).toUpperCase(), true);
        setBusyError("❌ NO SE PUDO");
        setTimeout(()=> hideBusy(), 650);
      }
    }

    async function handleBarcode_ADD(code){
      const clean = String(code||"").trim();
      if (!clean) return;

      addBarcodeEl.value = clean;
      addSkuEl.value = "";
      addDescEl.value = "";
      productoAddHintEl.style.display = "none";
      productoAddHintEl.innerHTML = "";
      setAddMsg("", false);

      showBusy("VERIFICANDO CÓDIGO...");
      try{
        const j = await catFind(clean);
        if (j.exists){
          productoAddHintEl.innerHTML =
            `<div>YA EXISTE EN CATÁLOGO</div><div class="line2">SKU: ${j.sku||"-"} | ${j.descripcion||"-"} | STOCK: ${Number(j.stock||0)}</div>`;
          productoAddHintEl.style.display = "block";
          addSkuEl.value = j.sku || "";
          addDescEl.value = j.descripcion || "";
          setBusySuccess("✅ YA EXISTE");
          setTimeout(()=> hideBusy(), 450);
        }else{
          setBusySuccess("✅ LISTO");
          setTimeout(()=> hideBusy(), 250);
          addSkuEl.focus();
        }
      }catch(e){
        setBusyError("❌ ERROR");
        setTimeout(()=> hideBusy(), 700);
        setAddMsg(String(e.message||e), true);
      }
    }

    function onTipoChange_(){
      const t = (tipoMovEl.value || "").toUpperCase();
      if (t === "AJUSTE"){
        lblCantidadEl.textContent = "STOCK REAL CONTADO";
        cantidadEl.placeholder = "INGRESE STOCK REAL";
        cantidadEl.value = "";
        cantidadEl.classList.add("adjustMode");
        btnGuardar.textContent = "✅ APLICAR AJUSTE";
      }else{
        lblCantidadEl.textContent = "CANTIDAD";
        cantidadEl.placeholder = "INGRESE SU CANTIDAD";
        cantidadEl.value = "";
        cantidadEl.classList.remove("adjustMode");
        btnGuardar.textContent = "✅ GUARDAR";
      }
    }

    function limpiarCampos_MOV(){
      resetOrden_();
      barcodeEl.value = "";
      obsEl.value = "";
      setProducto(null,"",null);
      resetTipoYcantidadUI_();
    }

    async function guardarMovimiento(){
      const orden = ordenEl.value.trim() || "0";
      const tipo_sel = (tipoMovEl.value || "").trim().toUpperCase();
      const barcode = barcodeEl.value.trim();
      const cantidadRaw = (cantidadEl.value || "").trim();
      const obsUser = (obsEl.value || "").trim().toUpperCase();

      if (!currentProducto || currentBarcode !== barcode) { btnGuardar.disabled = true; return; }
      if (!tipo_sel || !barcode) { setMsg("FALTAN DATOS", true); return; }

      let tipo_mov = tipo_sel;
      let cantidad = Number(cantidadRaw || 0);
      let observacion = obsUser;

      if (tipo_sel === "AJUSTE"){
        if (typeof currentStock !== "number"){
          setMsg("PRIMERO BUSCÁ EL PRODUCTO (STOCK)", true);
          return;
        }
        if (!cantidadRaw || isNaN(cantidad) || cantidad < 0){
          setMsg("INGRESE STOCK REAL VÁLIDO", true);
          return;
        }

        const stockReal = Math.floor(cantidad);
        const diff = stockReal - currentStock;

        if (diff === 0){
          showBusy("APLICANDO AJUSTE...");
          setBusySuccess("✅ SIN DIFERENCIA");
          setTimeout(()=> hideBusy(), 650);
          setMsg("NO HAY DIFERENCIA DE STOCK", false);
          resetFormAfterAction_();
          return;
        }

        tipo_mov = diff > 0 ? "ENTRADA" : "SALIDA";
        cantidad = Math.abs(diff);

        const audit = `AJUSTE AUTOMÁTICO | STOCK REAL: ${stockReal} | SISTEMA: ${currentStock} | DIF: ${diff}`;
        observacion = obsUser ? (audit + " | " + obsUser) : audit;
      }else{
        if (!cantidadRaw || isNaN(cantidad) || cantidad <= 0){
          setMsg("FALTAN DATOS", true);
          return;
        }
        cantidad = Math.floor(cantidad);
      }

      btnGuardar.disabled = true;

      const data = {
        secret: SECRET,
        token: getToken_(),
        action: "move",
        orden,
        tipo_mov,
        barcode,
        cantidad,
        observacion,
        sku: currentProducto.sku,
        descripcion: currentProducto.descripcion
      };

      try{
        showBusy(tipo_sel === "AJUSTE" ? "APLICANDO AJUSTE..." : "GUARDANDO MOVIMIENTO...");

        await fetch(APPS_SCRIPT_URL, {
          method:"POST",
          mode:"no-cors",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(data)
        });

        memLookup.delete(barcode);
        catalogCache = [];

        setBusySuccess(tipo_sel === "AJUSTE" ? "✅ AJUSTE APLICADO" : "✅ GUARDADO");
        setTimeout(()=> hideBusy(), 700);

        setMsg("", false);
        limpiarCampos_MOV();
      }catch(e){
        setBusyError("❌ ERROR AL GUARDAR");
        setTimeout(()=> hideBusy(), 900);
        setMsg("ERROR AL ENVIAR", true);
      }finally{
        btnGuardar.disabled = !currentProducto;
      }
    }

    // ===== MOVIMIENTOS LIST =====
    function fmtFecha(iso){
      try{
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        const dd = String(d.getDate()).padStart(2,"0");
        const mm = String(d.getMonth()+1).padStart(2,"0");
        const yy = d.getFullYear();
        const hh = String(d.getHours()).padStart(2,"0");
        const mi = String(d.getMinutes()).padStart(2,"0");
        return `${dd}/${mm}/${yy} ${hh}:${mi}`;
      }catch{ return iso; }
    }

    function classifyMov_(it){
      const tipo = String(it.tipo_mov||"").toUpperCase();
      const obs = String(it.observacion||"").toUpperCase();
      if (obs.includes("AJUSTE AUTOMÁTICO")) return "adj";
      if (tipo === "ENTRADA") return "in";
      if (tipo === "SALIDA") return "out";
      return "";
    }

    async function cargarMovimientos(){
      listContainer.innerHTML = "";
      setListMsg("", false);

      const tipo = (fTipo.value || "").trim();
      const q = (fQ.value || "").trim();
      const from = (fFrom.value || "").trim();
      const to = (fTo.value || "").trim();

      showBusy("CARGANDO MOVIMIENTOS...");
      try{
        const j = await apiGet_({
          action:"list",
          limit:"160",
          tipo,
          q,
          from,
          to
        });

        const items = j.items || [];
        if (!items.length){
          setBusySuccess("✅ LISTO");
          setTimeout(()=> hideBusy(), 320);
          setListMsg("SIN RESULTADOS", false);
          return;
        }

        for (const it of items){
          const fecha = fmtFecha(it.timestamp);
          let tipoMov = String(it.tipo_mov||"");
          const isAjuste = String(it.observacion||"").toUpperCase().includes("AJUSTE AUTOMÁTICO");
          if (isAjuste) tipoMov = `${tipoMov} | AJUSTE`;

          const prod = String(it.descripcion||"");
          const cant = Number(it.cantidad||0);
          const obs = String(it.observacion||"");
          const usr = String(it.usuario||"");

          const div = document.createElement("div");
          div.className = "listItem " + classifyMov_(it);
          div.innerHTML = `
            <div class="liTop"><div>${fecha}</div><div>${tipoMov}</div></div>
            <div class="liSub">${prod}</div>
            <div class="liSub">CANTIDAD: ${cant}${usr ? " | USUARIO: " + usr : ""}${obs ? " | OBS: " + obs : ""}</div>
          `;
          listContainer.appendChild(div);
        }

        setBusySuccess("✅ LISTO");
        setTimeout(()=> hideBusy(), 320);
      }catch(e){
        setBusyError("❌ NO SE PUDO");
        setTimeout(()=> hideBusy(), 650);
        setListMsg(("NO SE PUDO CARGAR: " + (e.message||e)), true);
      }
    }

    // ===== PRODUCTOS =====
    function renderCatalog_(items){
      prodContainer.innerHTML = "";
      if (!items.length){
        setProdMsg("SIN RESULTADOS", false);
        return;
      }
      setProdMsg("", false);

      for (const it of items){
        const bc = String(it.barcode||"");
        const sku = String(it.sku||"");
        const desc = String(it.descripcion||"");
        const stock = Number(it.stock||0);

        const div = document.createElement("div");
        div.className = "listItem";
        div.innerHTML = `
          <div class="prodItem">
            <div class="prodLeft">
              <div class="skuLine">SKU: ${sku || "-"}</div>
              <div class="descLine">${desc || "-"}</div>
              <div class="codeLine">CÓDIGO: ${bc || "-"}</div>
            </div>
            <div class="prodRight">
              <div class="stkLbl">STOCK:</div>
              <div class="stkNum">${stock}</div>
            </div>
          </div>
        `;
        prodContainer.appendChild(div);
      }
    }

    async function cargarCatalogoPantalla_(){
      prodContainer.innerHTML = "";
      setProdMsg("", false);

      showBusy("CARGANDO PRODUCTOS...");
      try{
        const j = await fetchCatalog_();
        catalogCache = (j.items || []).slice();
        renderCatalog_(catalogCache);
        setBusySuccess("✅ LISTO");
        setTimeout(()=> hideBusy(), 320);
      }catch(e){
        setBusyError("❌ NO SE PUDO");
        setTimeout(()=> hideBusy(), 650);
        setProdMsg("NO SE PUDO CARGAR: " + (e.message||e), true);
      }
    }

    function filtrarCatalogo_(){
      const q = String(pQEl.value||"").trim().toUpperCase();
      if (!q){ renderCatalog_(catalogCache); return; }
      const out = catalogCache.filter(it => {
        const blob = `${it.barcode||""} ${it.sku||""} ${it.descripcion||""}`.toUpperCase();
        return blob.includes(q);
      });
      renderCatalog_(out);
    }

    // ===== AGREGAR PRODUCTO =====
    function clearAddForm_(){
      addBarcodeEl.value = "";
      addSkuEl.value = "";
      addDescEl.value = "";
      setAddMsg("", false);
      productoAddHintEl.style.display = "none";
      productoAddHintEl.innerHTML = "";
    }

    async function guardarProducto_(){
      const barcode = String(addBarcodeEl.value||"").trim();
      const sku = String(addSkuEl.value||"").trim().toUpperCase();
      const descripcion = String(addDescEl.value||"").trim().toUpperCase();

      if (!barcode || !sku || !descripcion){
        setAddMsg("FALTAN DATOS", true);
        return;
      }

      btnGuardarProd.disabled = true;

      const data = {
        action: "add_product",
        secret: SECRET,
        token: getToken_(),
        barcode,
        sku,
        descripcion
      };

      try{
        showBusy("GUARDANDO PRODUCTO...");

        await fetch(APPS_SCRIPT_URL, {
          method:"POST",
          mode:"no-cors",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(data)
        });

        setBusySuccess("✅ PRODUCTO GUARDADO");
        setTimeout(()=> hideBusy(), 700);

        setAddMsg("", false);
        clearAddForm_();
        catalogCache = [];
      }catch(e){
        setBusyError("❌ ERROR");
        setTimeout(()=> hideBusy(), 900);
        setAddMsg("ERROR AL GUARDAR", true);
      }finally{
        btnGuardarProd.disabled = false;
      }
    }

    // ===== SCANNER =====
    async function initDetector(){
      if (!("BarcodeDetector" in window)) throw new Error("BARCODEDETECTOR NO DISPONIBLE");
      const formats = await BarcodeDetector.getSupportedFormats();
      detector = new BarcodeDetector({ formats });
    }

    async function startCamera(){
      const targetVideo = (scanTarget === "ADD") ? videoAddEl : videoEl;
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} },
        audio:false
      });
      targetVideo.srcObject = stream;
      await targetVideo.play();
    }

    function stopCamera(){
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (stream) stream.getTracks().forEach(t=>t.stop());
      stream = null;
      videoEl.srcObject = null;
      videoAddEl.srcObject = null;
    }

    async function scanLoop(){
      if (!scanning) return;
      try{
        const targetVideo = (scanTarget === "ADD") ? videoAddEl : videoEl;
        const barcodes = await detector.detect(targetVideo);
        if (barcodes?.length){
          const code = (barcodes[0].rawValue || "").trim();
          if (code){
            if (code === lastCode) sameCount++;
            else { lastCode=code; sameCount=1; }
            if (sameCount >= REQUIRED_SAME_READS){
              stopScan();
              if (scanTarget === "ADD") await handleBarcode_ADD(code);
              else await handleBarcode_MOV(code);
              return;
            }
          }
        }
      }catch(e){}
      rafId = requestAnimationFrame(scanLoop);
    }

    async function startScan(){
      if (scanning) return;
      scanning = true;
      lastCode=""; sameCount=0;

      try{
        await initDetector();
        camWrapEl.style.display = (scanTarget === "MOV") ? "block" : "none";
        camWrapAddEl.style.display = (scanTarget === "ADD") ? "block" : "none";
        await startCamera();
        rafId = requestAnimationFrame(scanLoop);
      }catch(e){
        scanning=false;
        camWrapEl.style.display="none";
        camWrapAddEl.style.display="none";
        stopCamera();
        btnScan.textContent = "📷 ESCANEAR";
        btnScanAdd.textContent = "📷 ESCANEAR";
        if (scanTarget === "ADD") setAddMsg("ERROR DE CÁMARA / PERMISOS", true);
        else setMsg("ERROR DE CÁMARA / PERMISOS", true);
      }
    }

    function stopScan(){
      scanning=false;
      stopCamera();
      camWrapEl.style.display="none";
      camWrapAddEl.style.display="none";
      btnScan.textContent = "📷 ESCANEAR";
      btnScanAdd.textContent = "📷 ESCANEAR";
    }

    function toggleScan(target){
      if (scanning){ stopScan(); return; }
      scanTarget = target;
      startScan();
      btnScan.textContent = "🛑 DETENER";
      btnScanAdd.textContent = "🛑 DETENER";
    }

    // ===== EVENTS =====
    btnLogin.addEventListener("click", doLogin_);
    loginClaveEl.addEventListener("keydown", (e)=>{ if (e.key === "Enter") doLogin_(); });
    btnLogout.addEventListener("click", doLogoutAndGoLogin_);

    btnScan.addEventListener("click", ()=> toggleScan("MOV"));
    btnScanAdd.addEventListener("click", ()=> toggleScan("ADD"));

    ordenEl.addEventListener("input", ()=> { ordenEl.value = ordenEl.value.replace(/\D/g,""); });
    ordenEl.addEventListener("blur", ()=> { if (!ordenEl.value.trim()) ordenEl.value = "0"; });

    tipoMovEl.addEventListener("change", onTipoChange_);
    barcodeEl.addEventListener("change", async ()=>{ await handleBarcode_MOV(barcodeEl.value); });
    addBarcodeEl.addEventListener("change", async ()=>{ await handleBarcode_ADD(addBarcodeEl.value); });

    btnGuardar.addEventListener("click", guardarMovimiento);
    btnGuardarProd.addEventListener("click", guardarProducto_);

    btnVerMovs.addEventListener("click", async ()=>{
      stopScan();
      showOnly("LIST");
      await cargarMovimientos();
    });

    btnAddProd.addEventListener("click", ()=>{
      stopScan();
      showOnly("ADD");
      clearAddForm_();
      scanTarget = "ADD";
    });

    btnProductos.addEventListener("click", async ()=>{
      stopScan();
      showOnly("PRODUCTOS");
      await cargarCatalogoPantalla_();
    });

    btnVolver.addEventListener("click", ()=>{
      stopScan();
      showOnly("FORM");
      scanTarget = "MOV";
    });

    btnBackAdd.addEventListener("click", ()=>{
      stopScan();
      showOnly("FORM");
      scanTarget = "MOV";
    });

    btnVolverProd.addEventListener("click", ()=>{
      stopScan();
      showOnly("FORM");
      scanTarget = "MOV";
    });

    btnRefrescar.addEventListener("click", cargarMovimientos);
    btnAplicarFiltros.addEventListener("click", cargarMovimientos);

    btnRefrescarProd.addEventListener("click", cargarCatalogoPantalla_);
    btnBuscarProd.addEventListener("click", filtrarCatalogo_);
    pQEl.addEventListener("keydown", (e)=>{ if (e.key === "Enter") filtrarCatalogo_(); });

    // INIT
    (async function init(){
      resetOrden_();
      setProducto(null,"",null);
      resetTipoYcantidadUI_();
      setMsg("", false);
      setLoginMsg("", false);
      setListMsg("", false);
      setProdMsg("", false);
      setAddMsg("", false);
      await enterApp_();
    })();
  </script>
