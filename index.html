<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PUBLICARTEL - MOVIMIENTOS</title>
  <style>
    :root{
      /* Ajustá estos 2 si querés afinar a tu manual de marca */
      --brand: #0B2D5C;      /* azul principal */
      --brand-2: #154B9A;    /* azul secundario */
      --bg: #F3F6FB;         /* fondo institucional suave */
      --card: #FFFFFF;       /* tarjeta */
      --text: #0B2D5C;
      --muted: rgba(11,45,92,.70);
      --border: rgba(11,45,92,.30);
      --danger: #B00020;
      --shadow: 0 10px 30px rgba(11,45,92,.10);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-transform: uppercase;
    }

    .wrap{
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
    }

    .header{
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 16px 14px;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
    }

    .brandTitle{
      font-weight: 800;
      letter-spacing: .6px;
      font-size: 18px;
      line-height: 1.1;
    }

    .brandSub{
      font-size: 12px;
      opacity: .9;
      margin-top: 4px;
      letter-spacing: .4px;
    }

    .card{
      margin-top: 14px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(11,45,92,.08);
    }

    label{
      display:block;
      margin-top: 12px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: .4px;
      color: var(--muted);
    }

    input, select, textarea, button{
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 6px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text);
      outline: none;
      text-transform: uppercase;
    }

    input:focus, select:focus, textarea:focus{
      border-color: rgba(21,75,154,.65);
      box-shadow: 0 0 0 3px rgba(21,75,154,.12);
    }

    textarea{ resize: vertical; min-height: 76px; }

    .row{
      display:flex;
      gap:10px;
      align-items: end;
    }
    .row > div{ flex:1; }

    .btn{
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 800;
      letter-spacing: .6px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(11,45,92,.14);
      transition: transform .04s ease, opacity .2s ease;
      text-transform: uppercase;
    }
    .btn:active{ transform: translateY(1px); }

    .btn-primary{
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
    }

    .btn-secondary{
      background: #fff;
      color: var(--brand);
      border: 2px solid var(--border);
      box-shadow: none;
      font-weight: 800;
    }

    .btn[disabled]{
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .hint{
      margin-top: 10px;
      background: rgba(11,45,92,.06);
      border: 1px solid rgba(11,45,92,.10);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--brand);
      font-weight: 700;
      min-height: 44px;
      display:flex;
      align-items:center;
    }

    .msg{
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: .3px;
      color: var(--muted);
      min-height: 18px;
    }
    .msg.err{ color: var(--danger); font-weight: 700; }

    /* Cámara: oculta hasta que se presiona ESCANEAR */
    .camWrap{
      margin-top: 12px;
      display: none;
      background: #000;
      border-radius: var(--radius);
      overflow:hidden;
      border: 2px solid var(--border);
    }
    video{
      width: 100%;
      height: 320px;
      object-fit: cover;
      display:block;
      background:#000;
    }

    ::placeholder{ text-transform: uppercase; color: rgba(11,45,92,.45); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="brandTitle">PUBLICARTEL</div>
        <div class="brandSub">REGISTRO DE MOVIMIENTOS</div>
      </div>
      <div style="font-weight:800;opacity:.95;font-size:12px;letter-spacing:.5px;">
        STOCK
      </div>
    </div>

    <div class="card">
      <label>ORDEN (SOLO NÚMEROS)</label>
      <input id="orden" inputmode="numeric" pattern="[0-9]*" placeholder="EJ: 12345" />

      <label>TIPO DE MOVIMIENTO</label>
      <select id="tipo_mov">
        <option value="" selected disabled>INGRESE TIPO DE MOVIMIENTO</option>
        <option value="SALIDA">SALIDA</option>
        <option value="ENTRADA">ENTRADA</option>
        <option value="AJUSTE">AJUSTE</option>
      </select>

      <label>CÓDIGO DE BARRAS</label>
      <div class="row">
        <div><input id="barcode" placeholder="ESCANEÁ O ESCRIBÍ..." /></div>
        <div><button id="btnScan" type="button" class="btn btn-secondary">📷 ESCANEAR</button></div>
      </div>

      <div id="camWrap" class="camWrap">
        <video id="video" playsinline></video>
      </div>

      <div id="producto" class="hint"></div>
      <div id="msg" class="msg"></div>

      <label>CANTIDAD</label>
      <input id="cantidad" type="number" min="1" step="1" placeholder="INGRESE CANTIDAD" />

      <label>OBSERVACIÓN (OPCIONAL)</label>
      <textarea id="observacion" rows="2" placeholder="NOTAS..."></textarea>

      <button id="btnGuardar" type="button" class="btn btn-primary" disabled>✅ GUARDAR</button>
    </div>
  </div>

  <script>
    // === CONFIG ===
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxy5EYAU7K8fWOTJvp2PUwqQrpRtjzErK5PnTAeQW52p9kRmHsNxHZcrMWYT37khwgZ/exec";
    const SECRET = "PUBLI_2026_Stock!";

    const SPREADSHEET_ID = "1xdyknuy-wQID0VHMCEuvYc4fz0ljZTGfL7ek7U_M1wE";
    const CATALOG_SHEET_NAME = "catalogo";
    const REQUIRED_SAME_READS = 2;

    const videoEl = document.getElementById("video");
    const camWrapEl = document.getElementById("camWrap");
    const btnScan = document.getElementById("btnScan");
    const btnGuardar = document.getElementById("btnGuardar");

    const ordenEl = document.getElementById("orden");
    const tipoMovEl = document.getElementById("tipo_mov");
    const barcodeEl = document.getElementById("barcode");
    const cantidadEl = document.getElementById("cantidad");
    const obsEl = document.getElementById("observacion");

    const productoEl = document.getElementById("producto");
    const msgEl = document.getElementById("msg");

    let stream = null;
    let detector = null;
    let scanning = false;
    let rafId = null;

    let catalogoMap = {};
    let lastCode = "";
    let sameCount = 0;

    // Estado del producto validado actual
    let currentProducto = null; // {sku, descripcion} o null
    let currentBarcodeValid = ""; // barcode válido actual o ""

    function setMsg(t, isError=false){
      msgEl.className = "msg" + (isError ? " err" : "");
      msgEl.textContent = (t || "").toString().toUpperCase();
    }

    // Hint SOLO para producto válido. Si no existe: queda vacío (como pediste).
    function setProductoValido(producto, barcode){
      currentProducto = producto || null;
      currentBarcodeValid = producto ? (barcode || "") : "";

      if (!producto){
        productoEl.textContent = "";
        // deshabilita guardar si no hay producto válido
        btnGuardar.disabled = true;
        return;
      }

      productoEl.textContent = (`PRODUCTO: ${producto.descripcion || "-"} | SKU: ${producto.sku || "-"}`).toUpperCase();
      btnGuardar.disabled = false;
    }

    async function cargarCatalogo() {
      try {
        const tq = encodeURIComponent("select A,B,C");
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(CATALOG_SHEET_NAME)}&tq=${tq}&tqx=out:json`;

        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("NO SE PUDO DESCARGAR CATÁLOGO");
        const raw = await res.text();
        const jsonText = raw.substring(raw.indexOf("{"), raw.lastIndexOf("}") + 1);
        const data = JSON.parse(jsonText);

        const rows = data?.table?.rows || [];
        const map = {};
        for (const r of rows) {
          const c = r.c || [];
          const bc = (c[0]?.v ?? "").toString().trim();
          const sku = (c[1]?.v ?? "").toString().trim();
          const desc = (c[2]?.v ?? "").toString().trim();
          if (!bc) continue;
          map[bc] = { sku, descripcion: desc };
        }

        catalogoMap = map;
        setMsg(`CATÁLOGO CARGADO (${Object.keys(catalogoMap).length})`, false);
      } catch (e) {
        console.error(e);
        setMsg("ERROR CARGANDO CATÁLOGO", true);
      }
    }

    function validarBarcodeLocal(barcode) {
      const p = catalogoMap[barcode];
      return p ? { ok: true, producto: p } : { ok: false, producto: null };
    }

    async function initDetector() {
      if (!("BarcodeDetector" in window)) {
        throw new Error("BARCODEDETECTOR NO DISPONIBLE (CHROME ANDROID)");
      }
      const formats = await BarcodeDetector.getSupportedFormats();
      detector = new BarcodeDetector({ formats });
    }

    async function startCamera() {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      videoEl.srcObject = stream;
      await videoEl.play();
    }

    function stopCamera() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      videoEl.srcObject = null;
    }

    async function scanLoop() {
      if (!scanning) return;

      try {
        const barcodes = await detector.detect(videoEl);

        if (barcodes && barcodes.length) {
          const code = (barcodes[0].rawValue || "").trim();
          if (code) {
            if (code === lastCode) sameCount++;
            else { lastCode = code; sameCount = 1; }

            setMsg(`LEYENDO... (${sameCount}/${REQUIRED_SAME_READS})`, false);

            if (sameCount >= REQUIRED_SAME_READS) {
              barcodeEl.value = code;

              const v = validarBarcodeLocal(code);
              if (v.ok) {
                setProductoValido(v.producto, code);
                setMsg("CÓDIGO VÁLIDO", false);
              } else {
                // no mostrar texto “no existe”, solo deshabilitar y limpiar hint
                setProductoValido(null, "");
                setMsg("CÓDIGO NO REGISTRADO", true);
              }

              stopScan();
              return;
            }
          }
        }
      } catch (e) {
        console.warn(e);
      }

      rafId = requestAnimationFrame(scanLoop);
    }

    async function startScan() {
      if (scanning) return;
      scanning = true;
      btnScan.textContent = "🛑 DETENER";
      setMsg("ABRIENDO CÁMARA...", false);

      lastCode = "";
      sameCount = 0;

      try {
        await initDetector();

        camWrapEl.style.display = "block";     // ✅ mostrar cámara al escanear
        await startCamera();

        setMsg("APUNTÁ AL CÓDIGO", false);
        rafId = requestAnimationFrame(scanLoop);
      } catch (e) {
        console.error(e);
        scanning = false;
        btnScan.textContent = "📷 ESCANEAR";
        camWrapEl.style.display = "none";
        setMsg("ERROR DE CÁMARA / PERMISOS", true);
        stopCamera();
      }
    }

    function stopScan() {
      scanning = false;
      btnScan.textContent = "📷 ESCANEAR";
      stopCamera();
      camWrapEl.style.display = "none"; // ✅ ocultar cámara al terminar
    }

    btnScan.addEventListener("click", () => {
      if (!scanning) startScan();
      else stopScan();
    });

    // ORDEN solo números
    ordenEl.addEventListener("input", () => {
      ordenEl.value = ordenEl.value.replace(/\D/g, "");
    });

    // Si escriben barcode manualmente: valida, muestra producto si existe, si no, limpia y deshabilita
    barcodeEl.addEventListener("change", () => {
      const code = barcodeEl.value.trim();
      if (!code) {
        setProductoValido(null, "");
        setMsg("", false);
        return;
      }

      const v = validarBarcodeLocal(code);
      if (v.ok) {
        setProductoValido(v.producto, code);
        setMsg("CÓDIGO VÁLIDO", false);
      } else {
        setProductoValido(null, "");
        setMsg("CÓDIGO NO REGISTRADO", true);
      }
    });

    btnGuardar.addEventListener("click", async () => {
      const orden = (ordenEl.value || "").trim();
      const tipo_mov = (tipoMovEl.value || "").trim().toUpperCase();
      const barcode = barcodeEl.value.trim();
      const cantidad = (cantidadEl.value || "").trim();
      const observacion = (obsEl.value || "").trim().toUpperCase();

      // Solo se habilita si hay producto válido, pero igual validamos por seguridad
      if (!currentProducto || !currentBarcodeValid || currentBarcodeValid !== barcode) {
        setMsg("VALIDÁ EL CÓDIGO ANTES DE GUARDAR", true);
        btnGuardar.disabled = true;
        return;
      }

      if (!orden || !tipo_mov || !barcode || !cantidad || Number(cantidad) <= 0) {
        setMsg("FALTAN DATOS (ORDEN / TIPO / BARCODE / CANTIDAD)", true);
        return;
      }

      btnGuardar.disabled = true;
      setMsg("ENVIANDO...", false);

      const data = {
        secret: SECRET,
        orden,
        tipo_mov,
        barcode,
        cantidad,
        observacion,
        sku: currentProducto.sku,
        descripcion: currentProducto.descripcion,
        usuario: ""
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        setMsg("GUARDADO", false);

        // limpiar para próximo
        barcodeEl.value = "";
        cantidadEl.value = "";
        obsEl.value = "";
        setProductoValido(null, "");
      } catch (e) {
        console.error(e);
        setMsg("ERROR AL ENVIAR", true);
      } finally {
        // si no hay producto válido, queda deshabilitado
        btnGuardar.disabled = !currentProducto;
      }
    });

    // init
    setProductoValido(null, "");
    setMsg("CARGANDO CATÁLOGO...", false);
    cargarCatalogo();
  </script>
</body>
</html>
