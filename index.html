<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESCÁNER MOVIMIENTOS</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; text-transform: uppercase; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input, select, textarea, button { width: 100%; padding: 12px; font-size: 16px; margin-top: 6px; text-transform: uppercase; }
    .row { display:flex; gap:10px; }
    .row > div { flex: 1; }
    .ok { color: green; margin-top: 10px; }
    .err { color: #b00020; margin-top: 10px; }
    .small { font-size: 13px; opacity: 0.9; margin-top: 6px; line-height: 1.35; }
    .box { background:#f5f5f5; padding:10px; border-radius:10px; margin-top:10px; }

    .camWrap { position: relative; width: 100%; margin-top: 12px; }
    video { width: 100%; height: 320px; background:#000; border-radius: 12px; object-fit: cover; }
    .aim {
      position:absolute;
      left: 10%;
      top: 18%;
      width: 80%;
      height: 64%;
      border: 3px solid rgba(0,255,0,0.75);
      border-radius: 12px;
      pointer-events: none;
      box-sizing: border-box;
    }

    /* placeholder en mayúscula */
    ::placeholder { text-transform: uppercase; }
  </style>
</head>
<body>
  <h2>REGISTRAR MOVIMIENTO</h2>

  <label>ORDEN</label>
  <input id="orden" inputmode="numeric" pattern="[0-9]*" placeholder="EJ: 12345" />

  <label>TIPO DE MOVIMIENTO</label>
  <select id="tipo_mov">
    <option value="" selected disabled>INGRESE TIPO DE MOVIMIENTO</option>
    <option value="SALIDA">SALIDA</option>
    <option value="ENTRADA">ENTRADA</option>
    <option value="AJUSTE">AJUSTE</option>
  </select>

  <label>CÓDIGO DE BARRAS</label>
  <div class="row">
    <div><input id="barcode" placeholder="ESCANEÁ O ESCRIBÍ..." /></div>
    <div><button id="btnScan" type="button">📷 ESCANEAR</button></div>
  </div>

  <div class="camWrap">
    <video id="video" playsinline></video>
    <div class="aim"></div>
  </div>

  <div id="producto" class="box small"></div>

  <label>CANTIDAD</label>
  <input id="cantidad" type="number" min="1" step="1" value="1" />

  <label>OBSERVACIÓN (OPCIONAL)</label>
  <textarea id="observacion" rows="2" placeholder="NOTAS..."></textarea>

  <!-- ✅ Botón guardar abajo de todo -->
  <button id="btnGuardar" type="button">✅ GUARDAR</button>

  <div id="msg"></div>

  <script>
    // === CONFIG ===
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxy5EYAU7K8fWOTJvp2PUwqQrpRtjzErK5PnTAeQW52p9kRmHsNxHZcrMWYT37khwgZ/exec";
    const SECRET = "PUBLI_2026_Stock!";

    const SPREADSHEET_ID = "1xdyknuy-wQID0VHMCEuvYc4fz0ljZTGfL7ek7U_M1wE";
    const CATALOG_SHEET_NAME = "catalogo";

    // Confirmación por estabilidad
    const REQUIRED_SAME_READS = 2;

    const videoEl = document.getElementById("video");
    const btnScan = document.getElementById("btnScan");
    const btnGuardar = document.getElementById("btnGuardar");
    const barcodeEl = document.getElementById("barcode");
    const productoEl = document.getElementById("producto");
    const msgEl = document.getElementById("msg");
    const ordenEl = document.getElementById("orden");
    const tipoMovEl = document.getElementById("tipo_mov");
    const obsEl = document.getElementById("observacion");
    const cantidadEl = document.getElementById("cantidad");

    let stream = null;
    let detector = null;
    let scanning = false;
    let rafId = null;

    let catalogoMap = {};
    let lastCode = "";
    let sameCount = 0;

    function setMsg(t, ok=true) {
      msgEl.className = ok ? "ok" : "err";
      msgEl.textContent = (t || "").toString().toUpperCase();
    }

    function setProducto(p, barcode = "") {
      if (!barcode) {
        productoEl.textContent = "";
        productoEl.style.color = "";
        return;
      }
      if (!p) {
        productoEl.textContent = (`❌ PRODUCTO NO ENCONTRADO EN CATÁLOGO (${barcode})`).toUpperCase();
        productoEl.style.color = "#b00020";
        return;
      }
      productoEl.textContent = (`PRODUCTO: ${p.descripcion || "-"} | SKU: ${p.sku || "-"}`).toUpperCase();
      productoEl.style.color = "";
    }

    async function cargarCatalogo() {
      try {
        const tq = encodeURIComponent("select A,B,C");
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(CATALOG_SHEET_NAME)}&tq=${tq}&tqx=out:json`;

        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("NO SE PUDO DESCARGAR CATÁLOGO (GVIZ)");
        const raw = await res.text();
        const jsonText = raw.substring(raw.indexOf("{"), raw.lastIndexOf("}") + 1);
        const data = JSON.parse(jsonText);

        const rows = data?.table?.rows || [];
        const map = {};
        for (const r of rows) {
          const c = r.c || [];
          const bc = (c[0]?.v ?? "").toString().trim();
          const sku = (c[1]?.v ?? "").toString().trim();
          const desc = (c[2]?.v ?? "").toString().trim();
          if (!bc) continue;
          map[bc] = { sku, descripcion: desc };
        }

        catalogoMap = map;
        setMsg(`✅ CATÁLOGO CARGADO (${Object.keys(catalogoMap).length} PRODUCTOS)`, true);
      } catch (e) {
        console.error(e);
        setMsg("❌ CATÁLOGO: " + (e.message || e), false);
      }
    }

    function validarBarcodeLocal(barcode) {
      const p = catalogoMap[barcode];
      return p ? { ok: true, producto: p } : { ok: false, producto: null };
    }

    async function initDetector() {
      if (!("BarcodeDetector" in window)) {
        throw new Error("BARCODEDETECTOR NO DISPONIBLE. USÁ CHROME EN ANDROID.");
      }
      const formats = await BarcodeDetector.getSupportedFormats();
      detector = new BarcodeDetector({ formats });
    }

    async function startCamera() {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      videoEl.srcObject = stream;
      await videoEl.play();
    }

    function stopCamera() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      videoEl.srcObject = null;
    }

    async function scanLoop() {
      if (!scanning) return;

      try {
        const barcodes = await detector.detect(videoEl);

        if (barcodes && barcodes.length) {
          const code = (barcodes[0].rawValue || "").trim();
          if (code) {
            if (code === lastCode) sameCount++;
            else { lastCode = code; sameCount = 1; }

            setMsg(`VIENDO: ${code} (${sameCount}/${REQUIRED_SAME_READS})`, true);

            if (sameCount >= REQUIRED_SAME_READS) {
              barcodeEl.value = code;

              const v = validarBarcodeLocal(code);

              if (!v.ok) {
                setProducto(null, code);
                setMsg("❌ NO EXISTE EN CATÁLOGO", false);
              } else {
                setProducto(v.producto, code);
                setMsg("✅ ESCANEADO Y VÁLIDO", true);
              }

              stopScan();
              return;
            }
          }
        }
      } catch (e) {
        console.warn(e);
      }

      rafId = requestAnimationFrame(scanLoop);
    }

    async function startScan() {
      if (scanning) return;
      scanning = true;
      btnScan.textContent = "🛑 DETENER";
      setMsg("ABRIENDO CÁMARA...", true);

      lastCode = "";
      sameCount = 0;

      try {
        await initDetector();
        await startCamera();
        setMsg("APUNTÁ AL CÓDIGO DENTRO DEL RECTÁNGULO…", true);
        rafId = requestAnimationFrame(scanLoop);
      } catch (e) {
        console.error(e);
        scanning = false;
        btnScan.textContent = "📷 ESCANEAR";
        setMsg("❌ " + (e.message || e), false);
        stopCamera();
      }
    }

    function stopScan() {
      scanning = false;
      btnScan.textContent = "📷 ESCANEAR";
      stopCamera();
    }

    btnScan.addEventListener("click", () => {
      if (!scanning) startScan();
      else stopScan();
    });

    // ✅ ORDEN solo números (bloquea letras)
    ordenEl.addEventListener("input", () => {
      ordenEl.value = ordenEl.value.replace(/\D/g, "");
    });

    // Validación manual con hint unificado
    barcodeEl.addEventListener("change", () => {
      const code = barcodeEl.value.trim();
      if (!code) { setProducto(null, ""); return; }

      const v = validarBarcodeLocal(code);
      if (!v.ok) {
        setProducto(null, code);
        setMsg("❌ NO EXISTE EN CATÁLOGO: " + code, false);
      } else {
        setProducto(v.producto, code);
        setMsg("✅ CÓDIGO VÁLIDO: " + code, true);
      }
    });

    btnGuardar.addEventListener("click", async () => {
      const orden = (ordenEl.value || "").trim(); // ya numérico
      const tipo_mov = (tipoMovEl.value || "").trim().toUpperCase();
      const barcode = barcodeEl.value.trim();
      const cantidad = cantidadEl.value;
      const observacion = (obsEl.value || "").trim().toUpperCase();

      if (!orden || !tipo_mov || !barcode || !cantidad || Number(cantidad) <= 0) {
        setMsg("FALTAN DATOS (ORDEN / TIPO MOV / BARCODE / CANTIDAD).", false);
        return;
      }

      const v = validarBarcodeLocal(barcode);
      if (!v.ok) {
        setProducto(null, barcode);
        setMsg("❌ NO SE PUEDE GUARDAR: BARCODE NO EXISTE EN CATÁLOGO.", false);
        return;
      }

      btnGuardar.disabled = true;
      setMsg("ENVIANDO...", true);

      const data = {
        secret: SECRET,
        orden,
        tipo_mov,
        barcode,
        cantidad,
        observacion,
        sku: v.producto.sku,
        descripcion: v.producto.descripcion,
        usuario: ""
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        setMsg("✅ ENVIADO. REVISÁ LA SHEET (MOVIMIENTOS).", true);
        barcodeEl.value = "";
        cantidadEl.value = 1;
        obsEl.value = "";
        setProducto(null, "");
      } catch (e) {
        console.error(e);
        setMsg("❌ NO SE PUDO ENVIAR: " + (e.message || e), false);
      } finally {
        btnGuardar.disabled = false;
      }
    });

    // init
    cargarCatalogo();
  </script>
</body>
</html>
