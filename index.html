<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PUBLICARTEL · MOVIMIENTOS</title>
  <style>
    :root{
      --brand:#0B2D5C;
      --brand2:#154B9A;
      --bg:#F3F6FB;
      --card:#FFFFFF;
      --text:#0B2D5C;
      --muted:rgba(11,45,92,.70);
      --border:rgba(11,45,92,.28);
      --danger:#B00020;
      --ok:#0F7A3A;
      --shadow:0 10px 30px rgba(11,45,92,.10);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);text-transform:uppercase}
    .wrap{max-width:560px;margin:0 auto;padding:16px}

    .header{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;border-radius:var(--radius);
      padding:16px 14px;box-shadow:var(--shadow);
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .brandTitle{font-weight:900;letter-spacing:.6px;font-size:18px;line-height:1.1}
    .brandSub{font-size:12px;opacity:.92;margin-top:4px;letter-spacing:.4px}

    .card{
      margin-top:14px;background:var(--card);border-radius:var(--radius);padding:14px;
      box-shadow:var(--shadow);border:1px solid rgba(11,45,92,.08)
    }

    label{display:block;margin-top:12px;font-weight:900;font-size:12px;letter-spacing:.4px;color:var(--muted)}
    input,select,textarea,button{
      width:100%;padding:12px;margin-top:6px;border-radius:12px;border:2px solid var(--border);
      font-size:16px;text-transform:uppercase;background:#fff;color:var(--text);outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:rgba(21,75,154,.65);box-shadow:0 0 0 3px rgba(21,75,154,.12)}
    textarea{min-height:76px;resize:vertical}

    .btn{
      border:none;font-weight:900;letter-spacing:.7px;cursor:pointer;
      background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
      box-shadow:0 10px 20px rgba(11,45,92,.14)
    }
    .btn-secondary{
      background:#fff;color:var(--brand);border:2px solid var(--border);box-shadow:none;font-weight:900
    }
    .btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}

    .camWrap{
      display:none;margin-top:12px;border-radius:var(--radius);overflow:hidden;
      border:2px solid var(--border);background:#000
    }
    video{width:100%;height:320px;object-fit:cover;display:block;background:#000}

    .hint{
      display:none;margin-top:10px;padding:10px 12px;border-radius:12px;
      background:rgba(11,45,92,.06);border:1px solid rgba(11,45,92,.10);
      font-weight:900
    }
    .hint .line2{margin-top:6px;color:var(--muted);font-size:12px;font-weight:900}

    .msg{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px;letter-spacing:.3px}
    .msg.err{color:var(--danger);font-weight:900}
    .msg.ok{color:var(--ok);font-weight:900}

    .topActions{display:flex;gap:10px;margin-top:12px}
    .topActions button{flex:1}

    .toggles{display:flex;gap:10px;margin-top:12px}
    .toggle{
      flex:1;display:flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:12px;border:2px solid var(--border);
      background:#fff;font-weight:900;color:var(--brand)
    }
    .toggle input{width:18px;height:18px;margin:0}

    .filterRow{display:flex;gap:10px;margin-top:12px}
    .filterRow > *{flex:1}

    .listItem{
      border:1px solid rgba(11,45,92,.10);
      background:rgba(11,45,92,.03);
      border-radius:12px;
      padding:10px 12px;
      margin-top:10px;
    }
    .liTop{display:flex;justify-content:space-between;gap:10px;font-weight:900}
    .liSub{margin-top:6px;color:var(--muted);font-weight:800;font-size:12px;line-height:1.35}

    .dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .dashCard{border:1px solid rgba(11,45,92,.10);background:rgba(11,45,92,.03);border-radius:12px;padding:10px 12px}
    .dashNum{font-weight:900;font-size:20px}
    .dashLbl{color:var(--muted);font-weight:900;font-size:12px;margin-top:4px}

    ::placeholder{color:rgba(11,45,92,.45)}
    .flash{animation:flash 0.8s ease}
    @keyframes flash{
      0%{transform:scale(1)}
      30%{transform:scale(1.01)}
      100%{transform:scale(1)}
    }

    /* ===== TOAST VERDE ===== */
    /* TOAST VERDE */
    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:linear-gradient(135deg, rgba(15,122,58,0.98), rgba(18,150,76,0.98));
      color:#fff;
      padding:12px 14px;
      border-radius:14px;
      box-shadow:0 14px 34px rgba(0,0,0,.18);
      font-weight:900;
      letter-spacing:.5px;
      display:none;
      z-index:9999;
      max-width:92vw;
      text-align:center;
    }
    .toast.show{display:block; animation:toastIn .22s ease;}
    @keyframes toastIn{
      from{opacity:0; transform:translateX(-50%) translateY(8px)}
      to{opacity:1; transform:translateX(-50%) translateY(0)}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="brandTitle">PUBLICARTEL</div>
        <div class="brandSub">MOVIMIENTOS DE STOCK</div>
      </div>
      <div style="font-weight:900;opacity:.95;font-size:12px;letter-spacing:.5px;">STOCK</div>
    </div>

    <!-- SCREEN: FORM -->
    <div id="screenForm" class="card">
      <button id="btnScan" type="button" class="btn-secondary">📷 ESCANEAR</button>

      <label>CÓDIGO DE BARRAS</label>
      <input id="barcode" placeholder="ESCANEÁ O ESCRIBÍ..." />

      <div id="camWrap" class="camWrap">
        <video id="video" playsinline></video>
      </div>

      <div id="producto" class="hint"></div>

      <div class="toggles">
        <div class="toggle">
          <input id="chkRapid" type="checkbox" />
          <div>MODO RÁPIDO</div>
        </div>
        <div class="toggle">
          <input id="chkAutoSave" type="checkbox" />
          <div>AUTO GUARDAR</div>
        </div>
      </div>

      <div class="topActions">
        <button id="btnVerMovs" type="button" class="btn-secondary">📄 MOVIMIENTOS</button>
        <button id="btnDashboard" type="button" class="btn-secondary">📊 DASHBOARD</button>
      </div>
      <!-- SOLO MOVIMIENTOS COMO BLOQUE -->
      <button id="btnVerMovs" type="button" class="btn-secondary">📄 MOVIMIENTOS</button>

      <label>ORDEN (SOLO NÚMEROS)</label>
      <input id="orden" inputmode="numeric" pattern="[0-9]*" placeholder="EJ: 0" value="0" />

      <label>TIPO DE MOVIMIENTO</label>
      <select id="tipo_mov">
        <option value="" selected disabled>INGRESE TIPO DE MOVIMIENTO</option>
        <option value="SALIDA">SALIDA</option>
        <option value="ENTRADA">ENTRADA</option>
        <option value="AJUSTE">AJUSTE</option>
      </select>

      <label>CANTIDAD</label>
      <input id="cantidad" type="number" min="1" step="1" placeholder="INGRESE CANTIDAD" value="1" />

      <label>OBSERVACIÓN (OPCIONAL)</label>
      <textarea id="observacion" placeholder="NOTAS..."></textarea>

      <button id="btnGuardar" type="button" class="btn" disabled>✅ GUARDAR</button>

      <div id="msg" class="msg"></div>
    </div>

    <!-- SCREEN: MOVIMIENTOS -->
    <div id="screenList" class="card" style="display:none;">
      <div class="topActions">
        <button id="btnVolver" type="button" class="btn-secondary">⬅️ VOLVER</button>
        <button id="btnRefrescar" type="button" class="btn-secondary">🔄 REFRESCAR</button>
      <div style="display:flex;gap:10px;">
        <button id="btnVolver" type="button" class="btn-secondary" style="flex:1;">⬅️ VOLVER</button>
        <button id="btnRefrescar" type="button" class="btn-secondary" style="flex:1;">🔄 REFRESCAR</button>
      </div>

      <div class="filterRow">
        <select id="fTipo">
          <option value="" selected>TODOS</option>
          <option value="ENTRADA">ENTRADA</option>
          <option value="SALIDA">SALIDA</option>
          <option value="AJUSTE">AJUSTE</option>
        </select>
        <input id="fQ" placeholder="BUSCAR (SKU / PROD / OBS)" />
      </div>

      <div class="filterRow">
        <input id="fFrom" type="date" />
        <input id="fTo" type="date" />
      </div>

      <button id="btnAplicarFiltros" type="button" class="btn-secondary">APLICAR FILTROS</button>

      <div id="listMsg" class="msg"></div>
      <div id="listContainer"></div>
    </div>

    <!-- SCREEN: DASHBOARD -->
    <div id="screenDash" class="card" style="display:none;">
      <div class="topActions">
        <button id="btnVolverDash" type="button" class="btn-secondary">⬅️ VOLVER</button>
        <button id="btnRefrescarDash" type="button" class="btn-secondary">🔄 REFRESCAR</button>
      </div>

      <div id="dashMsg" class="msg"></div>
      <div class="dashGrid">
        <div class="dashCard">
          <div id="dEntradas" class="dashNum">0</div>
          <div class="dashLbl">ENTRADAS HOY</div>
        </div>
        <div class="dashCard">
          <div id="dSalidas" class="dashNum">0</div>
          <div class="dashLbl">SALIDAS HOY</div>
        </div>
        <div class="dashCard">
          <div id="dMovs" class="dashNum">0</div>
          <div class="dashLbl">MOVIMIENTOS HOY</div>
        </div>
        <div class="dashCard">
          <div class="dashNum">TOP 5</div>
          <div class="dashLbl">PRODUCTOS (CANT. MOV.)</div>
        </div>
      </div>

      <div id="topContainer"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast">GUARDADO</div>

  <script>
    // ===== CONFIG =====
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8UHiav_LdmlUBVBEfklz88n1FkZZIdCU34Ypy_ZZYh6d6YaBnPmrKPYcfMCnX78sr/exec";
    const APPS_SCRIPT_URL = "PEGA_AQUI_TU_EXEC";
    const SECRET = "PUBLI_2026_Stock!";
    const SPREADSHEET_ID = "1xdyknuy-wQID0VHMCEuvYc4fz0ljZTGfL7ek7U_M1wE";
    const CATALOG_SHEET_NAME = "catalogo";
    const REQUIRED_SAME_READS = 2;

    // ===== DOM =====
    const toastEl = document.getElementById("toast");

    const screenForm = document.getElementById("screenForm");
    const screenList = document.getElementById("screenList");
    const screenDash = document.getElementById("screenDash");

    const videoEl = document.getElementById("video");
    const camWrapEl = document.getElementById("camWrap");
    const btnScan = document.getElementById("btnScan");
    const btnGuardar = document.getElementById("btnGuardar");
    const btnVerMovs = document.getElementById("btnVerMovs");
    const btnDashboard = document.getElementById("btnDashboard");

    const chkRapid = document.getElementById("chkRapid");
    const chkAutoSave = document.getElementById("chkAutoSave");

    const ordenEl = document.getElementById("orden");
    const tipoMovEl = document.getElementById("tipo_mov");
    const barcodeEl = document.getElementById("barcode");
    const cantidadEl = document.getElementById("cantidad");
    const obsEl = document.getElementById("observacion");
    const productoEl = document.getElementById("producto");
    const msgEl = document.getElementById("msg");

    // list
    const btnVolver = document.getElementById("btnVolver");
    const btnRefrescar = document.getElementById("btnRefrescar");
    const btnAplicarFiltros = document.getElementById("btnAplicarFiltros");
    const fTipo = document.getElementById("fTipo");
    const fQ = document.getElementById("fQ");
    const fFrom = document.getElementById("fFrom");
    const fTo = document.getElementById("fTo");
    const listMsgEl = document.getElementById("listMsg");
    const listContainer = document.getElementById("listContainer");

    // dash
    const btnVolverDash = document.getElementById("btnVolverDash");
    const btnRefrescarDash = document.getElementById("btnRefrescarDash");
    const dashMsgEl = document.getElementById("dashMsg");
    const dEntradas = document.getElementById("dEntradas");
    const dSalidas = document.getElementById("dSalidas");
    const dMovs = document.getElementById("dMovs");
    const topContainer = document.getElementById("topContainer");

    // ===== STATE =====
    let catalogoMap = {};
    let currentProducto = null;
    let currentBarcodeValid = "";
    let currentStock = null;

    let stream = null;
    let detector = null;
    let scanning = false;
    let rafId = null;
    let lastCode = "";
    let sameCount = 0;

    function setMsg(t="", cls="") {
      msgEl.className = "msg" + (cls ? " " + cls : "");
    function setMsg(t="", err=false){
      msgEl.className = "msg" + (err ? " err" : "");
      msgEl.textContent = (t||"").toString().toUpperCase();
    }
    function setListMsg(t="", cls="") {
      listMsgEl.className = "msg" + (cls ? " " + cls : "");
    function setListMsg(t="", err=false){
      listMsgEl.className = "msg" + (err ? " err" : "");
      listMsgEl.textContent = (t||"").toString().toUpperCase();
    }
    function setDashMsg(t="", cls="") {
      dashMsgEl.className = "msg" + (cls ? " " + cls : "");
      dashMsgEl.textContent = (t||"").toString().toUpperCase();
    }

    function showToast(text){
      toastEl.textContent = (text||"").toString().toUpperCase();
      toastEl.classList.add("show");
      navigator.vibrate?.(90);
      setTimeout(()=> toastEl.classList.remove("show"), 1400);
    }

    function setProductoValido(producto, barcode, stock) {
    function setProductoValido(producto, barcode, stock){
      currentProducto = producto || null;
      currentBarcodeValid = producto ? (barcode || "") : "";
      currentStock = (typeof stock === "number") ? stock : null;

      if (!producto){
        productoEl.style.display = "none";
        productoEl.innerHTML = "";
        btnGuardar.disabled = true;
        return;
      }

      const line1 = `PRODUCTO: ${producto.descripcion||"-"} | SKU: ${producto.sku||"-"}`;
      const line2 = (typeof currentStock === "number") ? `STOCK ACTUAL: ${currentStock}` : `STOCK ACTUAL: ...`;
      const line2 = (typeof stock === "number") ? `STOCK ACTUAL: ${stock}` : `STOCK ACTUAL: ...`;

      productoEl.innerHTML = `<div>${line1}</div><div class="line2">${line2}</div>`;
      productoEl.style.display = "block";
      btnGuardar.disabled = false;
    }

    async function cargarCatalogoSilencioso() {
    async function cargarCatalogoSilencioso(){
      const tq = encodeURIComponent("select A,B,C");
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(CATALOG_SHEET_NAME)}&tq=${tq}&tqx=out:json`;
      const res = await fetch(url, { cache:"no-store" });
      const raw = await res.text();
      const jsonText = raw.substring(raw.indexOf("{"), raw.lastIndexOf("}") + 1);
      const data = JSON.parse(jsonText);

      const rows = data?.table?.rows || [];
      const map = {};
      for (const r of rows) {
      for (const r of rows){
        const c = r.c || [];
        const bc = (c[0]?.v ?? "").toString().trim();
        const sku = (c[1]?.v ?? "").toString().trim();
        const desc = (c[2]?.v ?? "").toString().trim();
        if (!bc) continue;
        map[bc] = { sku, descripcion: desc };
      }
      catalogoMap = map;
    }

    function validarBarcodeLocal(barcode) {
    function validarBarcodeLocal(barcode){
      const p = catalogoMap[barcode];
      return p ? { ok:true, producto:p } : { ok:false, producto:null };
    }

    async function fetchStock(sku){
      try{
        const url = `${APPS_SCRIPT_URL}?action=stock&secret=${encodeURIComponent(SECRET)}&sku=${encodeURIComponent(sku)}`;
        const res = await fetch(url, { cache:"no-store" });
        const j = await res.json();
        if (!j.ok) return null;
        return Number(j.stock || 0);
      }catch{
        return null;
      }
    }

    async function initDetector(){
      if (!("BarcodeDetector" in window)) throw new Error("BARCODEDETECTOR NO DISPONIBLE");
      const formats = await BarcodeDetector.getSupportedFormats();
      detector = new BarcodeDetector({ formats });
    }

    async function startCamera(){
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} },
        audio:false
      });
      videoEl.srcObject = stream;
      await videoEl.play();
    }

    function stopCamera(){
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (stream) stream.getTracks().forEach(t=>t.stop());
      stream = null;
      videoEl.srcObject = null;
    }

    async function handleValidBarcode(code){
    async function handleBarcode(code){
      barcodeEl.value = code;
      const v = validarBarcodeLocal(code);

      const v = validarBarcodeLocal(code);
      if (!v.ok){
        setProductoValido(null,"");
        setMsg("", "");
        if (chkRapid.checked) startScan();
        setMsg("", false);
        return;
      }

      setProductoValido(v.producto, code, null);
      const stock = await fetchStock(v.producto.sku);
      setProductoValido(v.producto, code, (typeof stock === "number") ? stock : null);

      setMsg("", "");

      if (chkRapid.checked) {
        if (chkAutoSave.checked && canAutoSave_()) {
          await guardarMovimiento_();
        } else {
          cantidadEl.focus();
          cantidadEl.select?.();
        }
        startScan();
      }
    }

    function canAutoSave_(){
      const orden = ordenEl.value.trim();
      const tipo_mov = (tipoMovEl.value || "").trim();
      const cantidad = (cantidadEl.value || "").trim();
      return !!(orden && tipo_mov && currentProducto && currentBarcodeValid && cantidad && Number(cantidad) > 0);
      setMsg("", false);
    }

    async function scanLoop(){
      if (!scanning) return;
      try{
        const barcodes = await detector.detect(videoEl);
        if (barcodes?.length){
          const code = (barcodes[0].rawValue || "").trim();
          if (code){
            if (code === lastCode) sameCount++;
            else { lastCode=code; sameCount=1; }

            if (sameCount >= REQUIRED_SAME_READS){
              stopScan();
              await handleValidBarcode(code);
              await handleBarcode(code);
              return;
            }
          }
        }
      }catch(e){}
      rafId = requestAnimationFrame(scanLoop);
    }

    async function startScan(){
      if (scanning) return;
      scanning = true;
      btnScan.textContent = "🛑 DETENER";
      lastCode=""; sameCount=0;

      try{
        await initDetector();
        camWrapEl.style.display = "block";
        await startCamera();
        rafId = requestAnimationFrame(scanLoop);
      }catch(e){
        scanning=false;
        btnScan.textContent="📷 ESCANEAR";
        camWrapEl.style.display="none";
        stopCamera();
        setMsg("ERROR DE CÁMARA / PERMISOS", "err");
        setMsg("ERROR DE CÁMARA / PERMISOS", true);
      }
    }

    function stopScan(){
      scanning=false;
      btnScan.textContent="📷 ESCANEAR";
      stopCamera();
      camWrapEl.style.display="none";
    }

    function limpiarCamposDespuesDeGuardar(){
      // por defecto orden queda en 0 (si lo borran, lo volvemos a 0)
      if (!ordenEl.value.trim()) ordenEl.value = "0";

      barcodeEl.value = "";
      obsEl.value = "";
      cantidadEl.value = "1";
      setProductoValido(null,"");
    }

    async function guardarMovimiento_(){
    async function guardarMovimiento(){
      const orden = ordenEl.value.trim() || "0";
      const tipo_mov = (tipoMovEl.value || "").trim().toUpperCase();
      const barcode = barcodeEl.value.trim();
      const cantidad = (cantidadEl.value || "").trim();
      const observacion = (obsEl.value || "").trim().toUpperCase();

      if (!currentProducto || currentBarcodeValid !== barcode) { btnGuardar.disabled = true; return; }
      if (!tipo_mov || !barcode || !cantidad || Number(cantidad) <= 0) { setMsg("FALTAN DATOS", "err"); return; }
      if (!tipo_mov || !barcode || !cantidad || Number(cantidad) <= 0) { setMsg("FALTAN DATOS", true); return; }

      btnGuardar.disabled = true;

      const data = {
        secret: SECRET,
        orden,
        tipo_mov,
        barcode,
        cantidad,
        observacion,
        sku: currentProducto.sku,
        descripcion: currentProducto.descripcion,
        usuario:""
      };

      try{
        await fetch(APPS_SCRIPT_URL, {
          method:"POST",
          mode:"no-cors",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(data)
        });

        showToast("✅ MOVIMIENTO INGRESADO");
        setMsg("", "");
        setMsg("", false);
        limpiarCamposDespuesDeGuardar();

      }catch(e){
        setMsg("ERROR AL ENVIAR", "err");
        setMsg("ERROR AL ENVIAR", true);
      }finally{
        btnGuardar.disabled = !currentProducto;
      }
    }

    // ===== LISTA / DASH (sin cambios de lógica acá, quedan igual) =====
    // ===== MOVIMIENTOS LIST =====
    function fmtFecha(iso){
      try{
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        const dd = String(d.getDate()).padStart(2,"0");
        const mm = String(d.getMonth()+1).padStart(2,"0");
        const yy = d.getFullYear();
        const hh = String(d.getHours()).padStart(2,"0");
        const mi = String(d.getMinutes()).padStart(2,"0");
        return `${dd}/${mm}/${yy} ${hh}:${mi}`;
      }catch{ return iso; }
    }

    async function cargarMovimientos(){
      setListMsg("CARGANDO...");
      setListMsg("CARGANDO...", false);
      listContainer.innerHTML = "";

      const tipo = (fTipo.value || "").trim();
      const q = (fQ.value || "").trim();
      const from = (fFrom.value || "").trim();
      const to = (fTo.value || "").trim();

      try{
        const url = `${APPS_SCRIPT_URL}?action=list&secret=${encodeURIComponent(SECRET)}&limit=80`
          + `&tipo=${encodeURIComponent(tipo)}&q=${encodeURIComponent(q)}`
          + `&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;

        const res = await fetch(url, { cache:"no-store" });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "ERROR");

        const items = json.items || [];
        if (!items.length){ setListMsg("SIN RESULTADOS"); return; }
        if (!items.length){ setListMsg("SIN RESULTADOS", false); return; }

        setListMsg("");
        setListMsg("", false);
        for (const it of items){
          const fecha = fmtFecha(it.timestamp);
          const tipoMov = String(it.tipo_mov||"");
          const prod = String(it.descripcion||"");
          const cant = Number(it.cantidad||0);
          const obs = String(it.observacion||"");

          const div = document.createElement("div");
          div.className = "listItem";
          div.innerHTML = `
            <div class="liTop"><div>${fecha}</div><div>${tipoMov}</div></div>
            <div class="liSub">${prod}</div>
            <div class="liSub">CANTIDAD: ${cant}${obs ? " | OBS: " + obs : ""}</div>
          `;
          listContainer.appendChild(div);
        }
      }catch(e){
        setListMsg("NO SE PUDO CARGAR", "err");
      }
    }

    async function cargarDashboard(){
      setDashMsg("CARGANDO...");
      topContainer.innerHTML = "";
      try{
        const url = `${APPS_SCRIPT_URL}?action=dashboard&secret=${encodeURIComponent(SECRET)}`;
        const res = await fetch(url, { cache:"no-store" });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "ERROR");

        dEntradas.textContent = Number(json.today?.entradas || 0);
        dSalidas.textContent = Number(json.today?.salidas || 0);
        dMovs.textContent = Number(json.today?.movimientos || 0);

        const top = json.top || [];
        for (const t of top){
          const div = document.createElement("div");
          div.className = "listItem";
          div.innerHTML = `
            <div class="liTop"><div>${(t.descripcion||"")}</div><div>${Number(t.cantidad||0)}</div></div>
            <div class="liSub">${t.sku ? "SKU: " + t.sku : ""}</div>
          `;
          topContainer.appendChild(div);
        }

        setDashMsg("");
      }catch(e){
        setDashMsg("NO SE PUDO CARGAR", "err");
        setListMsg("NO SE PUDO CARGAR", true);
      }
    }

    // ===== EVENTS =====
    btnScan.addEventListener("click", ()=> scanning ? stopScan() : startScan());

    ordenEl.addEventListener("input", ()=> { ordenEl.value = ordenEl.value.replace(/\D/g,""); });

    // si el usuario lo borra, lo devolvemos a 0 al salir del campo
    ordenEl.addEventListener("blur", ()=> {
      if (!ordenEl.value.trim()) ordenEl.value = "0";
    });
    ordenEl.addEventListener("blur", ()=> { if (!ordenEl.value.trim()) ordenEl.value = "0"; });

    barcodeEl.addEventListener("change", async ()=>{
      const code = barcodeEl.value.trim();
      if (!code){ setProductoValido(null,""); setMsg(""); return; }
      await handleValidBarcode(code);
      if (!code){ setProductoValido(null,""); setMsg("", false); return; }
      await handleBarcode(code);
    });

    btnGuardar.addEventListener("click", guardarMovimiento_);
    btnGuardar.addEventListener("click", guardarMovimiento);

    btnVerMovs.addEventListener("click", async ()=>{
      screenForm.style.display="none";
      screenDash.style.display="none";
      screenList.style.display="block";
      await cargarMovimientos();
    });

    btnDashboard.addEventListener("click", async ()=>{
      screenForm.style.display="none";
      screenList.style.display="none";
      screenDash.style.display="block";
      await cargarDashboard();
    });

    btnVolver.addEventListener("click", ()=>{
      screenList.style.display="none";
      screenDash.style.display="none";
      screenForm.style.display="block";
    });

    btnVolverDash.addEventListener("click", ()=>{
      screenDash.style.display="none";
      screenList.style.display="none";
      screenForm.style.display="block";
    });

    btnRefrescar.addEventListener("click", cargarMovimientos);
    btnAplicarFiltros.addEventListener("click", cargarMovimientos);

    btnRefrescarDash.addEventListener("click", cargarDashboard);

    // INIT
    // init
    ordenEl.value = "0";
    setProductoValido(null,"");
    setMsg("");
    cargarCatalogoSilencioso().catch(()=> setMsg("ERROR CARGANDO CATÁLOGO", "err"));
    setMsg("", false);
    cargarCatalogoSilencioso().catch(()=> setMsg("ERROR CARGANDO CATÁLOGO", true));
  </script>
</body>
</html>
